// ---------- ComfyUI: a whole API-format workflow, with its useful inputs as fields ----------
const COMFY = "/generate/sync";
const COMFY_NUMBERS = ["steps", "cfg", "denoise", "width", "height", "length", "num_frames", "frame_rate", "fps",
  "batch_size", "seconds", "duration"];
// The workflow loaded in the Workflow tab, for the smoke test: {endpoint, workflow}.
let comfyLoaded = null;
// Where convert-workflows.sh (vast.ai ComfyUI image) leaves each provisioned workflow, in the
// API format /generate/sync takes, seeds already __RANDOM_INT__.
const COMFY_DIR = "/opt/comfyui-api-wrapper/workflows";

function comfyBody(workflow) { return { input: { workflow_json: workflow, return_outputs_as_base64: true } }; }

const isApiWorkflow = w => w && typeof w === "object" && !Array.isArray(w) && Object.keys(w).length > 0
  && Object.values(w).every(n => n && typeof n === "object" && typeof n.class_type === "string");

// [{id, key, kind, label, value}] for the inputs a person would change. A text's role comes
// from the input it feeds (a sampler's positive or negative).
function comfyFields(workflow) {
  const feeds = {};
  for (const node of Object.values(workflow)) {
    for (const [key, value] of Object.entries(node.inputs || {})) {
      if (Array.isArray(value) && value.length === 2) (feeds[String(value[0])] ||= []).push(key);
    }
  }
  const fields = [];
  const ids = Object.keys(workflow).sort((a, b) => Number(a) - Number(b) || a.localeCompare(b));
  for (const id of ids) {
    const node = workflow[id];
    for (const [key, value] of Object.entries(node.inputs || {})) {
      if (Array.isArray(value)) continue;  // a link to another node
      const where = `node ${id} · ${node.class_type}`;
      if ((key === "text" || key === "prompt") && typeof value === "string") {
        const role = feeds[id]?.includes("positive") ? "positive prompt" : feeds[id]?.includes("negative") ? "negative prompt" : key;
        fields.push({ id, key, kind: "text", label: role, where, order: role === "negative prompt" ? 1 : 0, value });
      } else if (key === "seed" || key === "noise_seed") {
        fields.push({ id, key, kind: "seed", label: key, where, order: 4, value });
      } else if (/^Load(Image|Audio|Video)/.test(node.class_type) && ["image", "audio", "video", "file"].includes(key)
                 && typeof value === "string") {
        fields.push({ id, key, kind: "file", label: `input ${key}`, where, order: 2, value });
      } else if (COMFY_NUMBERS.includes(key) && typeof value === "number") {
        fields.push({ id, key, kind: "number", label: key, where, order: 3, value });
      }
    }
  }
  return fields.sort((a, b) => a.order - b.order);
}

// How to fetch the endpoint's own workflows from one of its workers, with that worker's id
// filled in from the workers panel when there is one.
function comfyHowTo(summary) {
  const names = [...(summary?.comfy?.workflows || [])].sort();
  const body = el("div");
  const box = el("details", { className: "howto", open: true },
    el("summary", { textContent: "Get this endpoint's workflows" }), body);
  // Only a ready worker is sure to have the files: until one is, the commands have a
  // placeholder. Redrawn only when the worker changes, so a selection being copied survives.
  let shown = null;
  const draw = () => {
    const workers = workersNow ? allWorkers(workersNow) : [];
    const pick = workers.find(w => ["ready", "busy"].includes(statusClass(w)));
    const id = pick ? String(pick.id) : "<worker id>";
    if (id === shown) return;
    shown = id;
    const one = names[0] || "<name>.json";
    body.replaceChildren(
      el("p", { textContent: "Each worker keeps the workflows its template provisions, already converted to the " +
        `API format this route takes (the benchmark runs one of them), in ${COMFY_DIR}/. Copy them from a worker, ` +
        "then drop one below." }),
      names.length ? el("p", {}, "This endpoint's template provisions: ",
        ...names.flatMap((n, i) => [i ? ", " : "", el("code", { textContent: n }), i === 0 ? " (the benchmark's)" : ""]), ".")
        : el("p", { className: "sub", textContent: "The template names no workflows, so list the folder to see what the worker has." }),
      pick ? el("p", { className: "sub", textContent: `From worker ${id}, which is ready; any ready worker of this endpoint has the same files.` })
        : el("p", { className: "warn", textContent: "No worker is ready yet. The commands fill in with one when it is." }),
      el("label", { textContent: "all of them, with the Vast CLI" }),
      el("pre", { textContent: `vastai copy C.${id}:${COMFY_DIR}/ local:comfy-workflows/` }),
      el("label", { textContent: "or one, over SSH" }),
      el("pre", { textContent: `ssh $(vastai ssh-url ${id}) cat ${COMFY_DIR}/${one} > ${one}` }),
      el("p", { className: "sub", textContent: "Or open the workflow in ComfyUI and use Export (API): the same format." }));
  };
  draw();
  box.addEventListener("toggle", draw);
  const tick = setInterval(() => { if (!box.isConnected) clearInterval(tick); else if (box.open) draw(); }, 3000);
  return box;
}

function comfyForm() {
  let workflow = {};
  const summary = found?.summary;
  const endpointId = found?.endpoint.id;
  const status = el("p", { className: "hint", textContent: "No workflow loaded yet." });
  const fieldsBox = el("div", { className: "comfy-fields" });
  const own = filePicker("application/json,.json", false, "Drop an API-format workflow (.json) here, or choose one");
  const inputsHere = summary?.comfy?.inputs || [];
  const inputList = el("datalist", { id: `comfy-inputs-${Math.random().toString(36).slice(2)}` },
    ...inputsHere.map(name => el("option", { value: name })));
  const howTo = comfyHowTo(summary);
  const form = {
    el: el("div", {}, howTo, own.el, status, fieldsBox, inputList),
    inputs: [],
    body: () => comfyBody(workflow),
  };
  const changed = () => {
    comfyLoaded = { endpoint: endpointId, workflow };
    document.dispatchEvent(new Event("comfy-workflow"));  // smoke-test cards waiting for one
    form.onChange?.();
  };
  const set = (f, value) => { workflow[f.id].inputs[f.key] = value; changed(); };

  const draw = () => fieldsBox.replaceChildren(...comfyFields(workflow).map(f => {
    const tag = el("span", { className: "sub", textContent: ` ${f.where}` });
    const label = el("label", {}, f.label, tag);
    if (f.kind === "text") {
      const box = el("textarea", { value: f.value });
      labelFor(label, box);
      box.style.minHeight = f.label === "negative prompt" ? "50px" : "80px";
      box.addEventListener("input", () => set(f, box.value));
      return el("div", {}, label, box);
    }
    if (f.kind === "file") {
      const box = el("input", { type: "text", value: f.value, placeholder: "a file on the worker, or an http(s) URL" });
      box.setAttribute("list", inputList.id);
      labelFor(label, box);
      box.addEventListener("input", () => set(f, box.value.trim()));
      return el("div", {}, label, box, el("p", { className: "hint", textContent: inputsHere.length
        ? `On this endpoint's workers: ${inputsHere.join(", ")}. Or an http(s) URL the worker can download.`
        : "A file already on the worker, or an http(s) URL the worker can download." }));
    }
    if (f.kind === "seed") {
      const random = el("input", { type: "checkbox", checked: f.value === "__RANDOM_INT__" });
      const box = num(f.value === "__RANDOM_INT__" ? 42 : f.value, { min: 0, disabled: random.checked });
      labelFor(label, box);
      const apply = () => { box.disabled = random.checked; set(f, random.checked ? "__RANDOM_INT__" : Number(box.value)); };
      random.addEventListener("change", apply);
      box.addEventListener("input", apply);
      return el("div", { className: "seed-row" }, label, box, el("label", { className: "check" }, random, "random each request"));
    }
    const box = num(f.value, { step: f.key === "cfg" || f.key === "denoise" ? 0.1 : 1 });
    labelFor(label, box);
    box.addEventListener("input", () => set(f, Number(box.value)));
    return el("div", { className: "num-field" }, label, box);
  }));

  const load = (candidate, from) => {
    if (Array.isArray(candidate?.nodes)) {
      status.className = "warn";
      status.textContent = "That is ComfyUI's GUI format, which this route does not take. Copy the converted one " +
        "from a worker (above), or open it in ComfyUI and use Export (API).";
      return;
    }
    if (isApiWorkflow(candidate?.input?.workflow_json)) candidate = candidate.input.workflow_json;  // a whole request
    if (!isApiWorkflow(candidate)) {
      status.className = "warn";
      status.textContent = "Not an API-format ComfyUI workflow: expected node ids mapping to {class_type, inputs}.";
      return;
    }
    workflow = structuredClone(candidate);
    howTo.open = false;
    status.className = "hint";
    status.textContent = `${Object.keys(workflow).length} nodes, from ${from}. The fields below are the inputs ` +
      "most worth changing; everything else is in the JSON.";
    draw();
    changed();
  };

  own.onChange = () => {
    const file = fileOf(own.tokens[0]);
    if (!file) return;
    try {
      load(JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(file.url.split(",")[1]), c => c.charCodeAt(0)))),
           file.name);
    } catch (e) {
      status.className = "warn"; status.textContent = `${file.name} is not JSON: ${e.message}`;
    }
  };
  if (comfyLoaded?.endpoint === endpointId) load(comfyLoaded.workflow, "this tab earlier");  // survives a tab switch
  return form;
}
FORMS[COMFY] = () => comfyForm();

// ---------- the Python SDK equivalent of the body in the editor ----------
function py(value, indent = "") {
  const next = indent + "    ";
  if (value === null || value === undefined) return "None";
  if (value === true) return "True";
  if (value === false) return "False";
  if (typeof value === "string" || typeof value === "number") return JSON.stringify(value);
  if (Array.isArray(value)) {
    if (!value.length) return "[]";
    return `[\n${value.map(v => next + py(v, next)).join(",\n")},\n${indent}]`;
  }
  const entries = Object.entries(value);
  if (!entries.length) return "{}";
  return `{\n${entries.map(([k, v]) => `${next}${JSON.stringify(k)}: ${py(v, next)}`).join(",\n")},\n${indent}}`;
}

// Attached files, read from disk in the generated code: a data: URI each, as the page sends.
const DATA_URI = ["import base64, mimetypes", "",
  "def data_uri(path):",
  "    kind = mimetypes.guess_type(path)[0] or \"application/octet-stream\"",
  "    return f\"data:{kind};base64,\" + base64.b64encode(open(path, \"rb\").read()).decode()", ""];
function fileLines(body, name) {
  return filesIn(body).map(([path, file]) =>
    `${name}${path.map(k => `[${JSON.stringify(k)}]`).join("")} = data_uri(${JSON.stringify(file.name)})`);
}

function sdkCode(route, text) {
  let body;
  try { body = JSON.parse(text); } catch { return "# The JSON body does not parse yet."; }
  const streams = STREAMABLE.has(route) && body?.stream === true;
  const call = `await endpoint.request(${JSON.stringify(route)}, payload${streams ? ", stream=True" : ""})`;
  const files = fileLines(body, "payload");
  return [
    "import asyncio",
    "from vastai import Serverless",
    ...(files.length ? DATA_URI : [""]),
    `payload = ${py(body)}`,
    ...files,
    "",
    "async def main():",
    "    async with Serverless() as client:  # reads VAST_API_KEY from the environment",
    `        endpoint = await client.get_endpoint(name=${JSON.stringify(found.endpoint.name)})`,
    `        resp = ${call}`,
    ...(streams ? ["        async for chunk in resp[\"response\"]:", "            print(chunk)"]
                : ["        print(resp[\"response\"])"]),
    "",
    "asyncio.run(main())",
  ].join("\n");
}

// The same call through this server's /v1 proxy, with the openai package. The typed methods
// for the routes OpenAI defines; client.post for pyworker's own routes.
const OPENAI_METHODS = {
  "/v1/chat/completions": "client.chat.completions.create", "/v1/completions": "client.completions.create",
  "/v1/embeddings": "client.embeddings.create",
};
// Upload routes: the typed methods take files, as multipart; the proxy turns them into pyworker's JSON.
const OPENAI_UPLOADS = {
  "/v1/audio/transcriptions": ["client.audio.transcriptions.create", { file: "filename" }],
  "/v1/audio/translations": ["client.audio.translations.create", { file: "filename" }],
  "/v1/images/edits": ["client.images.edit", { image: "filename", mask: "mask_filename" }],
};
function uploadCode(route, body, head) {
  const opened = (field, nameField) => {
    const names = [body[nameField]].flat().filter(Boolean);
    delete body[field]; delete body[nameField];
    return names.map(n => `open(${JSON.stringify(n)}, "rb")`);
  };
  if (route === "/v1/videos/sync") {  // no typed method: multipart with httpx
    const files = Object.keys(body).filter(k => fileOf(body[k])).flatMap(k =>
      opened(k, `${k}_filename`).map(f => `(${JSON.stringify(k)}, ${f})`));
    const auth = proxyAuth();
    return [...auth.imports, "import httpx", "", auth.note,
      `base_url = ${JSON.stringify(`${BASE}/e/${encodeURIComponent(found.endpoint.name)}/v1`)}`, "",
      `fields = ${py(body)}`,
      `resp = httpx.post(base_url + "/videos/sync", data={k: str(v) for k, v in fields.items()},`,
      `                  files=[${files.join(", ")}], timeout=600${auth.httpx})`,
      "print(resp.headers.get(\"x-vast-worker\"), resp.headers.get(\"content-type\"), len(resp.content))"].join("\n");
  }
  const [method, fields] = OPENAI_UPLOADS[route];
  const args = Object.entries(fields).map(([f, n]) => {
    const files = opened(f, n);
    return files.length ? `${f}=${f === "image" && files.length > 1 ? `[${files.join(", ")}]` : files[0]}` : null;
  }).filter(Boolean);
  return [...head, `body = ${py(body)}`, `resp = ${method}(${[...args, "**body"].join(", ")})`, "print(resp)"].join("\n");
}

// How proxy code authenticates, with secrets read from the environment (never written into
// the code). A server holding the Vast key takes its access token as the API key; one without
// takes the caller's own Vast key there, and the token in its own header.
function proxyAuth() {
  const env = name => `os.environ[\'${name}\']`;
  if (needsToken && serverKey) return {
    imports: ["import os"],
    note: "# This server holds the Vast key; send its access token as the API key. Export it first:\n" +
          "# the `export SERVERLESS_UI_TOKEN=...` line printed when the server started.",
    client: 'api_key=os.environ["SERVERLESS_UI_TOKEN"]',
    httpx: `, headers={"Authorization": f"Bearer {${env("SERVERLESS_UI_TOKEN")}}"}`,
  };
  if (needsToken) return {
    imports: ["import os"],
    note: "# Send your own Vast key as the API key, and this server's access token in its header.\n" +
          "# Export the token first: the `export SERVERLESS_UI_TOKEN=...` line printed when the server started.",
    client: 'api_key=os.environ["VAST_API_KEY"], default_headers={"X-Serverless-UI-Token": os.environ["SERVERLESS_UI_TOKEN"]}',
    httpx: `, headers={"Authorization": f"Bearer {${env("VAST_API_KEY")}}", "X-Serverless-UI-Token": ${env("SERVERLESS_UI_TOKEN")}}`,
  };
  return serverKey ? {
    imports: [],
    note: "# This server holds the Vast key (VAST_API_KEY or --api-key); the client's key is unused.",
    client: 'api_key="unused"',
    httpx: "",
  } : {
    imports: ["import os"],
    note: "# Send your own Vast key as the API key.",
    client: 'api_key=os.environ["VAST_API_KEY"]',
    httpx: `, headers={"Authorization": f"Bearer {${env("VAST_API_KEY")}}"}`,
  };
}

function openaiCode(route, text) {
  let body;
  try { body = JSON.parse(text); } catch { return "# The JSON body does not parse yet."; }
  const auth = proxyAuth();
  const head = [
    ...auth.imports,
    "from openai import OpenAI",
    "",
    auth.note,
    `# /e/<endpoint>/v1 pins the endpoint; plain ${BASE}/v1 picks it by model.`,
    `client = OpenAI(base_url=${JSON.stringify(`${BASE}/e/${encodeURIComponent(found.endpoint.name)}/v1`)}, ${auth.client})`,
    "",
  ];
  if (route === COMFY) {  // not OpenAI-shaped: plain JSON through the proxy
    return [...auth.imports, "import httpx", "",
      auth.note,
      `url = ${JSON.stringify(`${BASE}/e/${encodeURIComponent(found.endpoint.name)}/generate/sync`)}`, "",
      `body = ${py(body)}`,
      `resp = httpx.post(url, json=body, timeout=600${auth.httpx})`,
      "print(resp.headers.get(\"x-vast-worker\"), resp.json()[\"status\"])",
      "for out in resp.json()[\"output\"]:",
      "    print(out[\"filename\"], out.get(\"mimetype\"))"].join("\n");
  }
  if (OPENAI_UPLOADS[route] || route === "/v1/videos/sync") return uploadCode(route, body, head);
  const files = fileLines(body, "body");
  const method = OPENAI_METHODS[route];
  const streams = STREAMABLE.has(route) && body?.stream === true;
  const call = method ? `${method}(**body)`
    : `client.post(${JSON.stringify(route.slice(3))}, body=body, cast_to=httpx.Response)`;
  const show = streams ? ["for chunk in resp:", "    print(chunk)"]
    : method ? ["print(resp)"]
    : ["print(resp.headers.get(\"x-vast-worker\"), resp.headers.get(\"content-type\"))",
       "print(resp.json() if \"json\" in resp.headers.get(\"content-type\", \"\") else len(resp.content))"];
  return [
    ...(method ? [] : ["import httpx"]),
    ...(files.length ? DATA_URI.slice(0, -1) : []),
    ...head,
    `body = ${py(body)}`,
    ...files,
    `resp = ${call}`,
    ...show,
  ].join("\n");
}

// ---------- sending ----------
// Bursts and load runs time whole replies, so a streaming body is sent without streaming;
// the form keeps its setting. Returns the body to send and whether anything was changed.
function unstreamed(route, body) {
  if (!STREAMABLE.has(route) || body?.stream !== true) return [body, false];
  const { stream, stream_options, ...rest } = body;
  return [rest, true];
}
const UNSTREAMED = "sent without streaming";

async function run(t) {
  let body;
  try { body = JSON.parse(t.editor.value); }
  catch (e) { return say(t, `The body is not valid JSON: ${e.message}`); }
  if (!body || typeof body !== "object" || Array.isArray(body)) return say(t, "The body must be a JSON object.");
  if (t.form.blank?.() && !("messages" in t.edits)) {
    return say(t, "Write a message first: an empty turn would still be sent to the model.");
  }
  const n = Number(t.count.value);
  const streams = STREAMABLE.has(t.route) && body.stream === true && n === 1;
  let unstreamedBurst = false;
  if (n > 1) [body, unstreamedBurst] = unstreamed(t.route, body);
  let sent;
  try { sent = withFiles(body); } catch (e) { return say(t, e.message); }
  say(t, "");
  // body keeps the placeholders: card headings and the conversation use it, not the files.
  const request = { endpoint: found.endpoint.id, route: t.route, body: sent, shown: body, unstreamedBurst };
  const controller = t.controller = new AbortController();
  running.add(controller);
  t.send.disabled = true; t.stop.hidden = false;
  try {
    if (n > 1) await runBurst(t, request, n, controller.signal);
    else await runOne(t, request, streams, controller.signal);
  } catch (e) {
    if (e.name !== "AbortError") say(t, e.message);
  } finally {
    running.delete(controller);
    if (t.controller === controller) t.controller = null;
    t.send.disabled = false; t.stop.hidden = true;
  }
}

function say(t, message) { t.status.textContent = message; t.status.hidden = !message; }

function addResult(t, node, controller = null) { placeResult(t.results, node, controller); }

// Newest first, each with a × that removes it, stopping it first if it is still running.
function placeResult(results, node, controller = null) {
  const close = el("button", { className: "close", type: "button", textContent: "×",
    title: "Remove this result (stops it if it is still running)" });
  close.setAttribute("aria-label", "Remove this result");
  close.addEventListener("click", () => { controller?.abort(); node.remove(); results.onChange?.(); });
  node.prepend(close);
  results.prepend(node);
  while (results.children.length > MAX_RESULTS) results.lastChild.remove();
  results.onChange?.();
  node.scrollIntoView({ block: "nearest", behavior: "smooth" });  // below the form, often off screen
}

async function runOne(t, { shown, unstreamedBurst, ...request }, streams, signal) {
  const card = el("div", { className: "result" });
  const meta = el("div", { className: "meta", role: "status" }, el("span", { textContent: `${LABELS[t.route]} · waiting for a worker…` }));
  const asked = t.form.ask?.(shown);
  if (asked) {
    card.append(el("div", { className: "msg user" }, el("b", { textContent: asked.tag }),
      typeof asked.text === "string" ? asked.text : JSON.stringify(asked.text ?? null)));
  }
  card.append(meta);
  addResult(t, card, t.controller);
  const started = performance.now();
  if (!streams) {
    let env;
    try { env = await api("api/call", request, signal); }
    catch (e) { return fail(card, meta, e, started); }
    renderEnvelope(card, meta, env, request.body);
    if (env.ok) t.form.done?.(shown, replyText(t.route, env.response));
    return;
  }
  // Streaming: show text as it arrives, timings when done.
  const out = el("div", { className: "out" });
  const chunks = [];
  let text = "", thought = "", finish = null, done = null, error = null, streamedFrom = null;
  let thinking = null;
  card.append(out);
  let reply;
  try {
    reply = await ndjson("api/call", request, signal, line => {
      if (line.type === "start") {
        streamedFrom = line.worker;
        meta.replaceChildren(el("span", { textContent: `${LABELS[t.route]} · streaming` }));
        meta.after(servedLine(line.worker));
      } else if (line.type === "chunk") {
        chunks.push(line.data);
        const c = line.data?.choices?.[0];
        finish = c?.finish_reason ?? finish;
        const thinkPiece = thinkingOf(c?.delta);
        if (thinkPiece) {
          if (!thinking) { thinking = thinkingBlock("", true); out.before(thinking); }
          thought += thinkPiece;
          thinking.lastChild.textContent = thought;
        }
        const piece = c?.delta?.content ?? c?.text ?? "";
        if (piece) {
          if (thinking) thinking.open = false;  // the answer has started
          text += piece; out.textContent = text;
        }
      } else if (line.type === "done") {
        done = line;
      } else if (line.type === "error") {
        error = line.error;
      }
    });
  } catch (e) {
    return fail(card, meta, e, started);
  }
  if (reply) {  // the worker answered without streaming
    renderEnvelope(card, meta, reply, request.body);
    if (reply.ok) t.form.done?.(shown, replyText(t.route, reply.response));
    return;
  }
  meta.replaceChildren(...metaParts({ route: t.route, ok: !error, status: 200, worker: streamedFrom, ...done }));
  if (error) card.append(el("div", { className: "err", textContent: error }));
  else if (!text && t.route === "/v1/chat/completions") out.replaceWith(noAnswer(finish));
  card.append(rawBlock({ chunks }));
  if (!error) t.form.done?.(shown, text);
}

// Reasoning models (vLLM or SGLang with a reasoning parser) stream their thinking as
// reasoning_content (newer vLLM: reasoning) and only the answer as content.
function thinkingOf(m) { return m?.reasoning_content ?? m?.reasoning ?? null; }

function thinkingBlock(text, open) {
  return el("details", { className: "think", open }, el("summary", { textContent: "thinking" }),
    el("div", { className: "think-text", textContent: text }));
}

function noAnswer(finish) {
  return el("p", { className: "warn", textContent: "No answer text, only thinking" +
    (finish === "length" ? ": the model ran out of max_tokens before answering." : ".") +
    " Raise max_tokens and send again; the conversation has not moved on." });
}

function fail(card, meta, e, started) {
  if (e.name === "AbortError") {
    meta.replaceChildren(el("span", { className: "x", textContent: "stopped" }));
    return;
  }
  card.classList.add("bad");
  meta.replaceChildren(el("span", { className: "x", textContent: "failed" }),
    el("span", { textContent: `${((performance.now() - started) / 1000).toFixed(2)}s` }));
  if (!card.querySelector(".served-line")) meta.after(servedLine(null));
  card.append(el("div", { className: "err", textContent: e.message }));
}

function host(url) {
  try { return new URL(url).host; } catch { return url || "?"; }
}

// Which worker a reply came from. A reply names only the worker's URL; the workers stream
// maps addresses to worker ids, and every label updates when that map grows.
// form: "line" on a card, "cell" in a table under a worker heading, "short" (the id) in a burst cell.
function servedBy(url, form = "line") {
  const span = el("span", { className: "served" });
  span.dataset.host = url ? host(url) : "";
  span.dataset.form = form;
  labelServed(span);
  return span;
}

function labelServed(span) {
  const h = span.dataset.host;
  if (!h) return span.replaceChildren("no worker reached");
  const id = workerHosts.get(h);
  const w = id != null && workersNow ? allWorkers(workersNow).find(x => x.id === id) : null;
  const gpu = w?.gpu_name ? `${w.num_gpus > 1 ? `${w.num_gpus}× ` : ""}${w.gpu_name}` : "";
  const name = id != null ? `worker ${id}` : "worker ?";
  span.title = [name, gpu, h].filter(Boolean).join(" · ") +
    (id == null ? " (not matched to a worker yet: addresses are looked up as workers appear)" : "");
  if (span.dataset.form === "short") return span.replaceChildren(el("b", { textContent: id ?? h }));
  span.replaceChildren(...(span.dataset.form === "line" ? ["served by "] : []), el("b", { textContent: name }),
    ...(gpu ? [` · ${gpu}`] : []), ` · ${h}`);
}

function servedLine(url) { return el("div", { className: "served-line" }, servedBy(url)); }

function metaParts(r) {  // only the parts this result has
  return [
    r.route && el("span", { textContent: LABELS[r.route] || r.route }),
    r.ok ? el("span", { className: "t", textContent: `${r.status ?? ""} ${r.seconds ?? "?"}s`.trim() })
         : el("span", { className: "x", textContent: `${r.status ?? "error"}${r.seconds != null ? ` ${r.seconds}s` : ""}` }),
    r.worker_seconds != null && el("span", { textContent: `worker ${r.worker_seconds}s` }),
    r.ttft != null && el("span", { textContent: `ttft ${r.ttft}s` }),
    r.tokens_per_second != null && el("span", { textContent: `${r.tokens_per_second} tok/s` }),
    r.usage?.completion_tokens != null && el("span", { textContent: `${r.usage.completion_tokens} tokens` }),
    r.chunks != null && el("span", { textContent: `${r.chunks} chunks` }),
  ].filter(Boolean);
}

function renderEnvelope(card, meta, env, body) {
  card.classList.toggle("bad", !env.ok);
  meta.replaceChildren(...metaParts(env));
  meta.after(servedLine(env.worker));
  if (!env.ok) card.append(el("div", { className: "err", textContent: env.error || "failed" }));
  else card.append(renderOutput(env, body));
  card.append(rawBlock(env));
}

// The useful part of a reply, by shape: media, images, text choices, else nothing (raw below).
function renderOutput(env, body) {
  const out = el("div", { className: "out" });
  if (env.media) {
    const src = `data:${env.media.type};base64,${env.media.b64}`;
    const kind = env.media.type.split("/")[0];
    out.append(kind === "audio" ? el("audio", { controls: true, src })
      : kind === "video" ? el("video", { controls: true, src })
      : kind === "image" ? el("img", { src, alt: "Generated image" })
      : el("div", { className: "sub", textContent: `${env.media.type}, ${Math.round(env.media.b64.length * 0.75)} bytes` }));
    return out;
  }
  const r = env.response;
  if (Array.isArray(r?.data) && r.data.some(d => d?.b64_json || (d?.url && typeof d.url === "string"))) {
    const mime = MIME[r.output_format || body?.output_format] || "image/png";
    out.append(el("div", { className: "imgs" }, r.data.map(d =>
      el("img", { alt: d.revised_prompt || "Generated image", src: d.b64_json ? `data:${mime};base64,${d.b64_json}` : d.url }))));
    return out;
  }
  if (Array.isArray(r?.choices)) {
    for (const c of r.choices) {
      const thought = thinkingOf(c?.message);
      if (thought) out.append(thinkingBlock(thought, false));
      const said = c?.message?.content ?? c?.text;
      out.append(said ? el("div", { className: "choice", textContent: said })
        : c?.message ? noAnswer(c.finish_reason) : el("div", { className: "choice", textContent: JSON.stringify(c) }));
    }
    return out;
  }
  if (env.route === COMFY && r && typeof r === "object") return comfyOutput(r, out);
  const view = routeView(env, body);
  if (view) { out.append(view); return out; }
  if (typeof r?.text === "string") {  // a transcription or translation
    out.append(el("div", { className: "choice", textContent: r.text }),
      ...(Array.isArray(r.segments) ? [el("div", { className: "sub", textContent:
        `${r.segments.length} segments${r.language ? ` · ${r.language}` : ""}${r.duration ? ` · ${r.duration}s` : ""}` })] : []));
    return out;
  }
  if (typeof r === "string") out.textContent = r;
  return out;
}

// ComfyUI's reply: each output inline (data + mimetype) when asked for, and the timings.
function comfyOutput(r, out) {
  if (r.status && !["completed", "success"].includes(r.status)) {
    out.append(el("p", { className: "warn", textContent: `${r.status}: ${r.message || ""}` }));
  }
  const media = (r.output || []).map(o => {
    const name = el("div", { className: "sub", textContent: o.filename || "output" });
    if (o.data && o.mimetype) {
      const src = `data:${o.mimetype};base64,${o.data}`;
      const kind = o.mimetype.split("/")[0];
      const player = kind === "image" ? el("img", { src, alt: o.filename || "" })
        : kind === "video" ? el("video", { controls: true, src })
        : kind === "audio" ? el("audio", { controls: true, src })
        : el("div", { className: "sub", textContent: `${o.mimetype}, ${size(Math.round(o.data.length * 0.75))}` });
      return el("div", { className: "comfy-out" }, player, name);
    }
    return el("div", { className: "comfy-out" }, name, el("div", { className: o.error ? "err" : "sub",
      textContent: o.error || "not returned inline (ask for return_outputs_as_base64, or configure S3)" }));
  });
  if (!media.length) out.append(el("p", { className: "sub", textContent: r.message || "No outputs." }));
  out.append(el("div", { className: "comfy-outs" }, media));
  const timings = Object.entries(r.timings || {}).filter(([, v]) => typeof v === "number");
  if (timings.length) out.append(el("div", { className: "sub", textContent: timings.map(([k, v]) => `${k} ${v.toFixed(2)}s`).join(" · ") }));
  return out;
}

function cosine(a, b) {
  let dot = 0, na = 0, nb = 0;
  a.forEach((x, i) => { dot += x * b[i]; na += x * x; nb += b[i] * b[i]; });
  return dot / (Math.sqrt(na * nb) || 1);
}

// Views for replies that are tables or lists of media rather than text.
function routeView(env, body) {
  const r = env.response;
  // align: a letter per column, l (text) or r (numbers); "m" is left and muted.
  const table = (head, rows, align) => el("div", { className: "tablewrap" }, el("table", { className: "view" },
    el("thead", {}, el("tr", {}, head.map((h, i) => el("th", { textContent: h, className: align[i] })))),
    el("tbody", {}, rows.map(row => el("tr", {}, row.map((v, i) => el("td", { textContent: String(v), className: align[i] })))))));
  const clip = t => (t.length > 90 ? `${t.slice(0, 90)}…` : t);
  switch (env.route) {
    case "/v1/embeddings": {
      const vectors = Array.isArray(r?.data) ? r.data.map(d => d?.embedding).filter(Array.isArray) : [];
      if (!vectors.length) return null;
      const inputs = [body?.input].flat();
      return el("div", {}, el("div", { textContent: `${vectors.length} vector${vectors.length === 1 ? "" : "s"} of ` +
          `${vectors[0].length} dimensions${r.usage?.prompt_tokens ? ` · ${r.usage.prompt_tokens} prompt tokens` : ""}` }),
        table(["input", "similarity to the first", "first values"], vectors.slice(0, 10).map((v, i) => [
          clip(String(inputs[i] ?? i)), i ? cosine(vectors[0], v).toFixed(3) : "–",
          v.slice(0, 3).map(x => x.toFixed(3)).join(", ") + " …"]), "lrm"));
    }
    case "/v1/rerank": {
      const results = Array.isArray(r) ? r : r?.results;  // SGLang answers with a bare list
      if (!Array.isArray(results)) return null;
      const docs = body?.documents || [];
      const scored = results.map(x => [x.relevance_score ?? x.score, x.index, x.document?.text ?? docs[x.index] ?? ""])
        .sort((a, b) => b[0] - a[0]);
      return table(["rank", "score", "doc", "text"], scored.map(([sc, i, t], rank) => [rank + 1, Number(sc).toFixed(4), i, clip(String(t))]), "rrrl");
    }
    case "/v1/score": {
      if (!Array.isArray(r?.data)) return null;
      const items = [body?.items ?? body?.text_2].flat();
      return table(["item", "score", "text"], r.data.map(d => [d.index, Number(d.score).toFixed(4), clip(String(items[d.index] ?? ""))]), "rrl");
    }
    case "/v1/audio/speech/batch": {
      if (!Array.isArray(r?.results)) return null;
      const texts = (body?.items || []).map(i => i?.input);
      return el("div", { className: "batch" }, r.results.map(x => el("div", { className: "item" },
        el("div", { className: "sub", textContent: `#${x.index} ${clip(String(texts[x.index] ?? ""))}` }),
        x.status === "success" && x.audio_data
          ? el("audio", { controls: true, src: `data:${x.media_type || "audio/wav"};base64,${x.audio_data}` })
          : el("div", { className: "err", textContent: x.error || x.status || "failed" }))));
    }
  }
  return null;
}

function replyText(route, r) {
  return route === "/v1/chat/completions" ? r?.choices?.[0]?.message?.content ?? null : null;
}

// Raw JSON, with long strings (base64 media) shortened so the page stays usable.
function rawBlock(value) {
  const short = JSON.stringify(value, (k, v) =>
    typeof v === "string" && v.length > 400 ? `<${v.length} chars>` : v, 2);
  return el("details", { className: "raw" }, el("summary", { textContent: "raw response" }),
    el("pre", { textContent: short }));
}

async function runBurst(t, { shown, unstreamedBurst, ...request }, n, signal) {
  const card = el("div", { className: "result" });
  const meta = el("div", { className: "meta", role: "status" });
  const grid = el("div", { className: "burst-grid" });
  card.append(meta, grid);
  addResult(t, card, t.controller);
  const times = [];
  let okCount = 0, landed = 0;
  const draw = () => {
    const sorted = [...times].sort((a, b) => a - b);
    const at = q => sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor(q * sorted.length))] : null;
    meta.replaceChildren(...kids([el("span", { textContent: `${LABELS[t.route]} burst` }),
      unstreamedBurst && el("span", { textContent: UNSTREAMED }),
      el("span", { className: okCount === landed ? "t" : "x",
        textContent: `${okCount}/${landed} ok of ${n}` }),
      sorted.length > 0 && el("span", { textContent:
        `min ${sorted[0]}s · p50 ${at(0.5)}s · p95 ${at(0.95)}s · max ${sorted[sorted.length - 1]}s` })]));
  };
  draw();
  try {
    await ndjson(`api/burst?n=${n}`, request, signal, r => {
      landed += 1;
      if (r.ok) { okCount += 1; times.push(r.seconds); }
      const cell = el("div", { className: "cell" + (r.ok ? "" : " bad"),
        textContent: `#${r.index} ${r.ok ? `${r.seconds}s` : (r.error || r.status)} · ` });
      cell.append(servedBy(r.worker, "short"));
      // Every image in the response: a request with n > 1 returns several.
      const images = r.ok && Array.isArray(r.response?.data) ? r.response.data.filter(d => d?.b64_json) : [];
      const mime = MIME[r.response?.output_format || request.body.output_format] || "image/png";
      if (images.length > 1) cell.append(` · ${images.length} images`);
      cell.append(...images.map((d, i) => el("img", { alt: `Generated image ${i + 1}`, src: `data:${mime};base64,${d.b64_json}` })));
      grid.append(cell);
      draw();
    });
  } catch (e) {
    if (e.name !== "AbortError") card.append(el("div", { className: "err", textContent: e.message }));
  }
}

// ---------- load runs: a rate profile, sent open-loop by /api/load ----------
const PRESETS = [
  ["Steady 1/s for 2 min", [[1, 1, 120]]],
  ["Ramp 0 → 4/s over 3 min", [[0, 4, 180]]],
  ["Up, hold, down (0 → 4/s)", [[0, 4, 120], [4, 4, 120], [4, 0, 120]]],
  ["Step 1 → 4 → 1/s", [[1, 1, 60], [4, 4, 120], [1, 1, 60]]],
  ["Spike to 8/s for 20 s", [[0.5, 0.5, 60], [8, 8, 20], [0.5, 0.5, 60]]],
];
const MAX_RPS = 20, MAX_SECONDS = 1800;
const LATENCY_WINDOW = 5;  // seconds of completions behind each rate and latency point

function clock(seconds) {
  const s = Math.max(0, Math.round(seconds));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function loadPanel(t) {
  let segments = PRESETS[2][1].map(([from, to, seconds]) => ({ from, to, seconds }));
  const preset = select(PRESETS.map(([name], i) => [String(i), name]), "2");
  const arrivals = select([["even", "evenly spaced"], ["poisson", "random (Poisson)"]], "even");
  const unique = el("input", { type: "checkbox", checked: true });
  const rows = el("tbody");
  const estimate = el("p", { className: "estimate" });
  const start = el("button", { className: "go", type: "button", textContent: "Start load" });
  const stop = el("button", { className: "ghost", type: "button", textContent: "Stop load", hidden: true });
  const add = el("button", { className: "linkish", type: "button", textContent: "+ add segment" });

  const draw = () => {
    rows.replaceChildren(...segments.map((seg, i) => {
      const cell = (key, props) => {
        const input = num(seg[key], { min: 0, step: "any", ...props });
        input.setAttribute("aria-label", `segment ${i + 1}: ${key === "seconds" ? "seconds" : `${key} (requests/s)`}`);
        input.addEventListener("input", () => { seg[key] = Number(input.value); summarise(); });
        return el("td", {}, input);
      };
      const remove = el("button", { className: "x-btn", type: "button", textContent: "×", title: "Remove segment",
        disabled: segments.length === 1 });
      remove.setAttribute("aria-label", `Remove segment ${i + 1}`);
      remove.addEventListener("click", () => { segments.splice(i, 1); draw(); });
      return el("tr", {}, cell("from", { max: MAX_RPS }), cell("to", { max: MAX_RPS }),
        cell("seconds", { min: 1 }), el("td", {}, remove));
    }));
    summarise();
  };
  const summarise = () => {
    const total = segments.reduce((n, s) => n + (s.seconds || 0), 0);
    const expected = segments.reduce((n, s) => n + ((s.from || 0) + (s.to || 0)) / 2 * (s.seconds || 0), 0);
    const peak = Math.max(...segments.map(s => Math.max(s.from || 0, s.to || 0)));
    const bad = total > MAX_SECONDS ? `at most ${MAX_SECONDS / 60} minutes`
      : peak > MAX_RPS ? `at most ${MAX_RPS} requests/s` : null;
    estimate.textContent = bad ? `Too long or too fast: ${bad}.`
      : `≈ ${Math.round(expected).toLocaleString()} requests over ${clock(total)}, peaking at ${peak}/s. Load can scale up workers, which adds instance time.`;
    start.disabled = !!bad || expected <= 0;
  };
  preset.addEventListener("change", () => {
    segments = PRESETS[Number(preset.value)][1].map(([from, to, seconds]) => ({ from, to, seconds }));
    draw();
  });
  add.addEventListener("click", () => {
    const last = segments[segments.length - 1];
    segments.push({ from: last.to, to: last.to, seconds: 60 });
    draw();
  });
  start.addEventListener("click", () => startLoad(t, segments.map(s => ({ ...s })), arrivals.value, unique.checked,
    { start, stop }));
  stop.addEventListener("click", () => loadRun?.abort());
  draw();
  return el("div", { className: "loadbox" },
    el("h4", { textContent: "Load run" }),
    el("p", { className: "hint", textContent:
      "Sends the body above on a schedule, whether or not earlier requests have answered, so queueing and scaling show. Rates are requests per second; each segment ramps from one rate to the next." }),
    field("preset", preset),
    el("table", { className: "profile" },
      el("thead", {}, el("tr", {}, el("th", { textContent: "from /s" }), el("th", { textContent: "to /s" }),
        el("th", { textContent: "seconds" }), el("th"))), rows),
    add,
    el("div", { className: "row" }, el("div", {}, field("arrivals", arrivals))),
    el("label", { className: "check" }, unique, "make each request unique (defeats prompt caching)"),
    estimate,
    el("div", { className: "go-row" }, start, stop));
}

async function startLoad(t, profile, arrivals, unique, buttons) {
  let body;
  try { body = JSON.parse(t.editor.value); }
  catch (e) { return say(t, `The body is not valid JSON: ${e.message}`); }
  let unstreamedLoad;
  [body, unstreamedLoad] = unstreamed(t.route, body);
  try { body = withFiles(body); } catch (e) { return say(t, e.message); }
  say(t, "");
  loadRun?.abort();
  const controller = loadRun = new AbortController();
  const run = { route: t.route, total: profile.reduce((n, s) => n + s.seconds, 0), state: "starting", unstreamedLoad,
                seconds: [], results: [], counts: { sent: 0, skipped: 0 }, inflight: 0, hover: null };
  // The meta line is redrawn every second: it is not announced. This says only state changes.
  const meta = el("div", { className: "meta" });
  const spoken = el("p", { className: "visually-hidden", role: "status" });
  const charts = el("div", { className: "charts" });
  const table = el("details", { className: "raw" }, el("summary", { textContent: "per-second data" }));
  const byWorker = el("details", { className: "raw", open: true }, el("summary"), el("div"));
  const card = el("div", { className: "result" }, spoken, meta, charts, byWorker, table);
  addResult(t, card, controller);
  let said = "";
  const draw = () => {
    drawLoad(run, meta, charts, table);
    drawByWorker(run, byWorker);
    if (run.state !== said) {
      said = run.state;
      spoken.textContent = `${LABELS[run.route]} load run ${{
        starting: "starting", running: "running", draining: "finishing the requests in flight",
        done: `done: ${run.counts.sent} sent, ${run.counts.skipped} skipped`,
        stopped: "stopped", failed: `failed: ${run.error}`,
      }[run.state] || run.state}`;
    }
  };
  run.redraw = draw;
  // On the container, which outlives each redraw, so hovering doesn't fight the redraws.
  charts.addEventListener("pointermove", e => {
    if (!run.rowCount) return;
    const box = charts.getBoundingClientRect();
    const t = Math.round((e.clientX - box.left - CHART_L) / (box.width - CHART_L - CHART_R) * run.xMax);
    const hover = Math.max(0, Math.min(run.rowCount - 1, t));
    if (hover !== run.hover) { run.hover = hover; draw(); }
  });
  charts.addEventListener("pointerleave", () => { run.hover = null; draw(); });
  buttons.start.disabled = true; buttons.stop.hidden = false;
  draw();
  try {
    await ndjson("api/load", { endpoint: found.endpoint.id, route: t.route, body, profile, arrivals, unique },
      controller.signal, line => {
        if (line.type === "start") Object.assign(run, { state: "running", total: line.seconds, expected: line.expected });
        else if (line.type === "tick") recordTick(run, line);
        else if (line.type === "done") Object.assign(run, { state: "done", counts: { sent: line.sent, skipped: line.skipped } });
        draw();
      });
  } catch (e) {
    if (e.name === "AbortError") run.state = "stopped";
    else { run.state = "failed"; run.error = e.message; }
  } finally {
    if (loadRun === controller) loadRun = null;
    buttons.start.disabled = false; buttons.stop.hidden = true;
    draw();
  }
}

// One row per second: what the server reported, and the workers panel's counts at that moment.
function recordTick(run, line) {
  const s = Math.round(line.t);
  if (line.target_rps === null && run.state === "running") run.state = "draining";
  const w = workersNow ? allWorkers(workersNow) : [];
  run.seconds[s] = {
    target: line.target_rps, inflight: line.inflight,
    ready: workersNow?.last ? w.filter(x => ["ready", "busy"].includes(statusClass(x))).length : null,
    loading: workersNow?.last ? w.filter(x => statusClass(x) === "loading").length : null,
  };
  run.inflight = line.inflight;
  run.counts = { sent: line.sent, skipped: line.skipped };
  run.results.push(...line.results);
}

// Which workers served the run: requests, failures and latency per worker.
function drawByWorker(run, box) {
  const groups = new Map();
  for (const r of run.results) {
    const key = r.worker ? host(r.worker) : "";
    const g = groups.get(key) || groups.set(key, { url: r.worker, n: 0, failed: 0, times: [] }).get(key);
    g.n += 1;
    if (r.ok) g.times.push(r.seconds); else g.failed += 1;
  }
  const rows = [...groups.values()].sort((a, b) => b.n - a.n);
  const served = rows.filter(g => g.url).length;
  box.firstChild.textContent = `served by ${served} worker${served === 1 ? "" : "s"}`;
  box.lastChild.replaceChildren(rows.length ? el("div", { className: "tablewrap" }, el("table", { className: "data labelled" },
    el("thead", {}, el("tr", {}, ["worker", "requests", "failed", "p50 s", "p95 s"].map(h => el("th", { textContent: h })))),
    el("tbody", {}, rows.map(g => {
      const sorted = [...g.times].sort((a, b) => a - b);
      return el("tr", {}, el("td", {}, servedBy(g.url, "cell")),
        ...[g.n, g.failed, fmt(quantile(sorted, 0.5)), fmt(quantile(sorted, 0.95))]
          .map(v => el("td", { textContent: String(v) })));
    })))) : el("p", { className: "hint", textContent: "No replies yet." }));
}

function quantile(sorted, q) {
  if (!sorted.length) return null;
  return sorted[Math.min(sorted.length - 1, Math.floor(q * sorted.length))];
}

// Per-second series. Completions and latency use a trailing window so low rates don't saw-tooth.
function loadSeries(run) {
  const n = run.seconds.length;
  const okAt = Array(n).fill(0), failAt = Array(n).fill(0), lat = Array.from({ length: n }, () => []);
  for (const r of run.results) {
    const s = Math.min(n - 1, Math.max(0, Math.ceil(r.done_at)));
    if (r.ok) { okAt[s] += 1; lat[s].push(r.seconds); } else failAt[s] += 1;
  }
  const rows = [];
  for (let s = 0; s < n; s++) {
    const from = Math.max(0, s - LATENCY_WINDOW + 1), span = s - from + 1;
    let ok = 0, fail = 0, window = [];
    for (let k = from; k <= s; k++) { ok += okAt[k]; fail += failAt[k]; window = window.concat(lat[k]); }
    window.sort((a, b) => a - b);
    const tick = run.seconds[s] || {};
    rows.push({ t: s, target: tick.target ?? null, ok: s ? ok / span : null, failed: s ? fail / span : null,
                inflight: tick.inflight ?? null, ready: tick.ready ?? null, loading: tick.loading ?? null,
                p50: quantile(window, 0.5), p95: quantile(window, 0.95) });
  }
  return rows;
}

const CHARTS = [
  { title: "Requests per second", unit: "/s", series: [
    { key: "target", name: "target", color: "var(--s1)" },
    { key: "ok", name: `completed (${LATENCY_WINDOW}s avg)`, color: "var(--s2)" },
    { key: "failed", name: `failed (${LATENCY_WINDOW}s avg)`, color: "var(--s3)" }] },
  { title: "Concurrency", unit: "", series: [
    { key: "inflight", name: "in flight", color: "var(--s1)" },
    { key: "ready", name: "ready workers", color: "var(--s2)" },
    { key: "loading", name: "loading workers", color: "var(--s3)" }] },
  { title: `Latency, ${LATENCY_WINDOW}s window`, unit: "s", series: [
    { key: "p50", name: "p50", color: "var(--s1)" },
    { key: "p95", name: "p95", color: "var(--s2)" }] },
];

function fmt(v, unit = "") {
  if (v === null || v === undefined) return "–";
  const a = Math.abs(v);
  const r = a === 0 ? 0 : a >= 100 ? Math.round(v) : a >= 1 ? Math.round(v * 10) / 10
    : Number(v.toPrecision(2));  // sub-second latencies keep two significant figures
  return `${r}${unit}`;
}

function drawLoad(run, meta, charts, table) {
  const ok = run.results.filter(r => r.ok).length, failed = run.results.length - ok;
  const elapsed = run.seconds.length ? run.seconds.length - 1 : 0;
  meta.replaceChildren(...kids([
    el("span", { textContent: `${LABELS[run.route]} load` }),
    run.unstreamedLoad && el("span", { textContent: UNSTREAMED }),
    el("span", { className: run.state === "failed" ? "x" : "t", textContent: run.state }),
    el("span", { textContent: `${clock(elapsed)} / ${clock(run.total)}` }),
    el("span", { textContent: `sent ${run.counts.sent}${run.expected ? ` of ≈${run.expected}` : ""}` }),
    el("span", { textContent: `ok ${ok}` }),
    failed > 0 && el("span", { className: "x", textContent: `failed ${failed}` }),
    run.counts.skipped > 0 && el("span", { className: "x", textContent: `skipped ${run.counts.skipped} (in-flight cap)` }),
    el("span", { textContent: `in flight ${run.inflight}` }),
  ]));
  if (run.error) meta.append(el("span", { className: "x", textContent: run.error }));

  const rows = loadSeries(run);
  const xMax = Math.max(run.total, rows.length - 1, 1);
  const width = Math.max(320, charts.clientWidth || 900);
  Object.assign(run, { xMax, rowCount: rows.length, width });
  const tip = el("div", { className: "tip", hidden: run.hover === null });
  charts.replaceChildren(...CHARTS.map((spec, i) => lineChart(spec, rows, xMax, run, i === CHARTS.length - 1, width)), tip);
  if (run.hover !== null && rows[run.hover]) {
    const row = rows[run.hover];
    tip.append(el("div", { className: "k", textContent: `at ${clock(row.t)}` }),
      ...CHARTS.flatMap(spec => spec.series.map(sr =>
        el("div", {}, el("i", { style: `background:${sr.color}` }),
          `${sr.name}: ${fmt(row[sr.key], spec.unit)}`))));
    const x = CHART_L + (run.hover / xMax) * (width - CHART_L - CHART_R);
    tip.style.top = "24px";
    tip.style.left = x > charts.clientWidth / 2 ? "" : `${x + 14}px`;
    tip.style.right = x > charts.clientWidth / 2 ? `${charts.clientWidth - x + 14}px` : "";
  }

  const recent = rows.slice(-120).reverse();
  const head = ["t", "target/s", "ok/s", "failed/s", "in flight", "ready", "loading", "p50 s", "p95 s"];
  table.replaceChildren(table.firstChild, el("div", { className: "tablewrap" }, el("table", { className: "data" },
    el("thead", {}, el("tr", {}, head.map(h => el("th", { textContent: h })))),
    el("tbody", {}, recent.map(r => el("tr", {}, [clock(r.t), fmt(r.target), fmt(r.ok), fmt(r.failed),
      fmt(r.inflight), fmt(r.ready), fmt(r.loading), fmt(r.p50), fmt(r.p95)].map(v => el("td", { textContent: v }))))))),
    rows.length > 120 && el("p", { className: "hint", textContent: "Latest 120 seconds." }));
}

const SVG = "http://www.w3.org/2000/svg";
function svg(tag, attrs = {}, ...children) {
  const node = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  node.append(...kids(children));
  return node;
}

function niceMax(v) {
  if (!(v > 0)) return 1;
  const p = 10 ** Math.floor(Math.log10(v));
  return [1, 2, 2.5, 5, 10].map(m => m * p).find(m => m >= v);
}

// One small multiple: lines over a shared time axis, a legend with the latest values,
// and a crosshair that follows the pointer across every chart of the run.
const CHART_L = 44, CHART_R = 8;  // plot margins in px, shared with the hover maths
function lineChart(spec, rows, xMax, run, showTime, W) {
  const H = 110, L = CHART_L, R = CHART_R, T = 6, B = showTime ? 18 : 6;
  const values = rows.flatMap(r => spec.series.map(s => r[s.key])).filter(v => v !== null && v !== undefined);
  const yMax = niceMax(Math.max(...values, 0));
  const X = t => L + (t / xMax) * (W - L - R);
  const Y = v => T + (1 - v / yMax) * (H - T - B);
  const latest = key => { for (let i = rows.length - 1; i >= 0; i--) if (rows[i][key] != null) return rows[i][key]; return null; };

  const head = el("div", { className: "chart-head" }, el("b", { textContent: spec.title }),
    spec.series.map(s => el("span", { className: "key" }, el("i", { style: `background:${s.color}` }),
      `${s.name} `, el("span", { textContent: fmt(latest(s.key), spec.unit) }))));

  const grid = [0, yMax / 2, yMax].map(v => [
    svg("line", { class: "grid", x1: L, x2: W - R, y1: Y(v), y2: Y(v) }),
    svg("text", { x: L - 6, y: Y(v) + 3.5, "text-anchor": "end" }, document.createTextNode(fmt(v))),
  ]);
  const step = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600].find(s => xMax / s <= 8) || 600;
  const times = showTime ? Array.from({ length: Math.floor(xMax / step) + 1 }, (_, i) => i * step).map(t =>
    svg("text", { x: X(t), y: H - 4, "text-anchor": "middle" }, document.createTextNode(clock(t)))) : [];

  const lines = spec.series.flatMap(s => {
    const parts = [];
    let current = [];
    rows.forEach(r => {
      if (r[s.key] === null || r[s.key] === undefined) { if (current.length) parts.push(current); current = []; }
      else current.push(`${X(r.t).toFixed(1)},${Y(r[s.key]).toFixed(1)}`);
    });
    if (current.length) parts.push(current);
    const last = [...rows].reverse().find(r => r[s.key] != null);
    return [
      ...parts.map(pts => svg("polyline", { class: "line", points: pts.join(" "), stroke: s.color })),
      last && svg("circle", { class: "end", cx: X(last.t), cy: Y(last[s.key]), r: 4, fill: s.color }),
    ];
  });
  const cross = run.hover !== null && svg("line", { class: "cross", x1: X(run.hover), x2: X(run.hover), y1: T, y2: H - B });

  const chart = svg("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, width: W, height: H,
    role: "img", "aria-label": `${spec.title} over time` }, grid, times, lines, cross);
  return el("div", {}, head, chart);
}

// ---------- workers: pushed by the autoscaler, relayed by /api/watch ----------
const STATUS_CLASS = {
  idle: "ready", running: "ready", Busy: "busy",
  created: "loading", creating: "loading", starting: "loading", loading: "loading",
  model_loading: "loading", rebooting: "loading",
  inactive: "off", stopped: "off", stopping: "off", stop_queued: "off", destroying: "off",
  error: "bad", exited: "bad", offline: "bad", unavail: "bad",
};
const CLASS_ORDER = { busy: 0, ready: 1, loading: 2, bad: 3, other: 4, off: 5 };
const statusClass = w => STATUS_CLASS[w.status] || "other";

function sleep(ms, signal) {
  return new Promise(resolve => {
    const t = setTimeout(resolve, ms);
    signal.addEventListener("abort", () => { clearTimeout(t); resolve(); }, { once: true });
  });
}

const SMOKE_PARALLEL = 3;

// What a healthy reply to each route looks like: [passed, what came back].
function smokeCheck(route, env) {
  const r = env.response;
  const media = env.media ? `${env.media.type}, ${Math.round(env.media.b64.length * 0.75 / 1024)} KB` : null;
  if (!env.ok) return [false, env.error || `HTTP ${env.status}`];
  switch (route) {
    case "/v1/completions":
    case "/v1/chat/completions": {
      const c = r?.choices?.[0];
      if (!c) return [false, "no choices in the reply"];
      const text = c.message?.content ?? c.text ?? "";
      const thought = thinkingOf(c.message);
      return [true, text ? JSON.stringify(text.trim().slice(0, 60))
        : thought ? `thinking only (${c.finish_reason || "?"}): raise max_tokens for an answer` : "empty answer"];
    }
    case "/v1/embeddings": {
      const v = r?.data?.[0]?.embedding;
      return Array.isArray(v) && v.length ? [true, `${r.data.length} vector(s) of ${v.length}`] : [false, "no embedding"];
    }
    case "/v1/audio/transcriptions":
    case "/v1/audio/translations": {  // silence: any text, even none, is a healthy reply
      const text = typeof r === "string" ? r : r?.text;
      return typeof text === "string" ? [true, text.trim() ? JSON.stringify(text.trim().slice(0, 60)) : "no speech heard (silence sent)"]
        : [false, "no text in the reply"];
    }
    case "/v1/images/edits":
    case "/v1/images/generations": {
      const n = Array.isArray(r?.data) ? r.data.filter(d => d?.b64_json || d?.url).length : 0;
      return n ? [true, `${n} image(s)`] : [false, "no image in the reply"];
    }
    case "/v1/audio/speech":
    case "/v1/audio/generate":
      return env.media?.type.startsWith("audio/") ? [true, media] : [false, `expected audio, got ${env.content_type || "JSON"}`];
    case "/v1/videos/sync":
      return env.media?.type.startsWith("video/") ? [true, media] : [false, `expected video, got ${env.content_type || "JSON"}`];
    case COMFY: {
      const outs = (r?.output || []).filter(o => o.data);
      return outs.length ? [true, `${outs.length} output(s): ${outs.map(o => o.mimetype).join(", ")}`]
        : [false, r?.message || r?.status || "no outputs inline"];
    }
    default:  // pyworker passes these to the backend as they are: any non-empty reply passes
      return media || (r && JSON.stringify(r) !== "{}") ? [true, media || `${JSON.stringify(r).length} bytes of JSON`]
        : [false, "empty reply"];
  }
}

  const uploads = routes.some(r => UPLOADS.has(r)) ? smokeUploads() : {};
  const rows = routes.map(route => {
    const box = el("input", { type: "checkbox", checked: !SMOKE_OFF.has(route) });
    const result = el("td", { className: "sub", textContent: uploads[route] ? "sends a tiny generated file" : "" });
    const cells = { status: el("td", { className: "num" }), secs: el("td", { className: "num" }), worker: el("td") };
    const tr = el("tr", {}, el("td", {}, el("label", { className: "check" }, box, LABELS[route])),
      cells.status, cells.secs, cells.worker, result);
    const music = firstChoice(route, summary.model).name === "music"
      ? { input: "[verse]\nHello, hello", instructions: "pop", max_new_tokens: 5 * YUE_FPS, response_format: "wav",
          extra_params: { cot: "off" } } : null;
    return { route, box, result, cells, tr,
             body: route === COMFY ? "(the workflow loaded in the Workflow tab)"
               : withModel(music || uploads[route] || SMOKE_BODIES[route] || SAMPLES[route] || {}) };
  });
  const run = el("button", { className: "go", type: "button", textContent: "Run" });
  const meta = el("div", { className: "meta", role: "status" });
  const count = () => {
    const n = rows.filter(r => r.box.checked).length;
    meta.replaceChildren(el("span", { textContent: "Smoke test" }),
      el("span", { textContent: `${n} request${n === 1 ? "" : "s"}, small bodies` }));
    run.disabled = !n;
  };
  rows.forEach(r => r.box.addEventListener("change", count));
  // The workflow route can run only once a workflow is loaded, which may come after the card.
  const endpointId = found.endpoint.id;
  const comfyRow = rows.find(r => r.route === COMFY);
  const comfyReady = () => {
    const ready = comfyLoaded?.endpoint === endpointId;
    comfyRow.result.textContent = ready ? "runs the workflow loaded in the Workflow tab"
                                        : "load a workflow in the Workflow tab first";
    comfyRow.box.disabled = !ready;
    if (!ready) comfyRow.box.checked = false;
    return ready;
  };
  if (comfyRow) {
    comfyRow.box.checked = comfyReady();
    const onLoad = () => {
      if (!comfyRow.box.isConnected) return document.removeEventListener("comfy-workflow", onLoad);
      if (comfyReady()) { comfyRow.box.checked = true; count(); }
    };
    document.addEventListener("comfy-workflow", onLoad);
  }
  count();
  const card = el("div", { className: "result smoke" }, meta,
    routes.length ? el("div", { className: "tablewrap" }, el("table", { className: "wk" },
      el("thead", {}, el("tr", {}, ["route", "status", "s", "worker", "result"].map((h, i) =>
        el("th", { textContent: h, className: i === 1 || i === 2 ? "num" : "" })))),
      el("tbody", {}, rows.map(r => r.tr))))
      : el("p", { className: "sub", textContent: "No routes are known for this endpoint." }),
    el("details", { className: "raw" }, el("summary", { textContent: "bodies sent" }),
      el("pre", { textContent: JSON.stringify(Object.fromEntries(rows.map(r => [r.route, r.body])), null, 2) })),
    el("div", { className: "go-row" }, run));

  run.addEventListener("click", async () => {
    const chosen = rows.filter(r => r.box.checked);
    rows.forEach(r => { r.box.disabled = true; });
    run.disabled = true;
    let passed = 0, done = 0;
    const tally = () => meta.replaceChildren(el("span", { textContent: "Smoke test" }),
      el("span", { className: passed === done ? "t" : "x", textContent: `${passed}/${done} passed` }),
      el("span", { textContent: done < chosen.length ? `${chosen.length - done} running` : "done" }));
    tally();
    const one = async r => {
      r.result.className = "sub"; r.result.textContent = "running…";
      const started = performance.now();
      let ok = false, detail, env = null;
      try {
        const sent = r.route === COMFY ? comfyBody(comfyLoaded.workflow) : withFiles(r.body);
        env = await api("api/call", { endpoint: found.endpoint.id, route: r.route, body: sent });
        [ok, detail] = smokeCheck(r.route, env);
      } catch (e) {
        detail = e.message;
      }
      r.cells.status.textContent = env?.status ?? "–";
      r.cells.secs.textContent = env?.seconds ?? ((performance.now() - started) / 1000).toFixed(2);
      r.cells.worker.replaceChildren(env?.worker ? servedBy(env.worker, "short") : "–");
      r.result.className = ok ? "" : "x";
      r.result.replaceChildren(el("span", { className: `st ${ok ? "done" : "failed"}`, textContent: ok ? "pass" : "fail" }),
        " ", detail);
      done += 1; passed += ok ? 1 : 0;
      tally();
    };
    const queue = [...chosen];
    await Promise.all(Array.from({ length: Math.min(SMOKE_PARALLEL, queue.length) }, async () => {
      while (queue.length) await one(queue.shift());
    }));
    rows.forEach(r => { r.box.disabled = false; });
    if (comfyRow) comfyReady();
    run.disabled = false;
    run.textContent = "Run again";
  });
  return card;
}

// ---------- proxy traffic: requests other programs send through /v1, as they happen ----------
const TRAFFIC_ROWS = 100;
const IN_FLIGHT = new Set(["routing", "streaming"]);

// Runs from connecting until the key is forgotten, so the count shows wherever you are.
function followTraffic() {
  traffic.controller?.abort();
  const controller = traffic.controller = new AbortController();
  const signal = controller.signal;
  traffic.rows.clear();
  const changed = () => { drawTrafficCount(); traffic.redraw?.(); };
  const tick = setInterval(() => {
    if ([...traffic.rows.values()].some(r => IN_FLIGHT.has(r.state))) changed();
  }, 1000);
  (async () => {
    for (let attempt = 0; !signal.aborted; attempt++) {
      try {
        await ndjson("api/traffic", {}, signal, line => {
          if (line.type === "history") {
            traffic.rows.clear();
            line.requests.forEach(r => traffic.rows.set(r.id, r));
            traffic.withheld = !!line.withheld;
            traffic.state = "live"; attempt = 0;
          } else if (line.type === "request") {
            traffic.rows.set(line.id, line);
            while (traffic.rows.size > TRAFFIC_ROWS) traffic.rows.delete(traffic.rows.keys().next().value);
          } else return;
          changed();
        });
        traffic.state = "reconnecting";
      } catch (e) {
        if (e.name === "AbortError" || e.token) break;
        traffic.state = `error: ${e.message}`;
      }
      changed();
      await sleep(Math.min(30000, 1000 * 2 ** attempt), signal);
    }
    clearInterval(tick);
  })();
}

function drawTrafficCount() {
  const rows = [...traffic.rows.values()];
  const flying = rows.filter(r => IN_FLIGHT.has(r.state)).length;
  $("traffic-count").textContent = flying ? `${flying} in flight` : rows.length ? String(rows.length) : "";
  $("traffic-count").classList.toggle("busy", flying > 0);
}

function showTraffic() {
  if (!confirmLeave("Opening proxy traffic")) return;
  stopEverything();
  watching?.abort();
  sidebarWorkers(null);
  selected = found = tab = null;
  choose(document.querySelectorAll(".eps button"), $("traffic-nav"), "aria-current");
  $("ep-pill").textContent = "proxy traffic";
  $("ep-pill").hidden = false;
  const filter = el("select", {}, el("option", { value: "", textContent: "all endpoints" }),
    ...[...document.querySelectorAll(".eps [data-name]")].map(b =>
      el("option", { value: b.dataset.name, textContent: b.dataset.name, selected: b.dataset.name === traffic.filter })));
  filter.addEventListener("change", () => { traffic.filter = filter.value; traffic.redraw?.(); });
  const summary = el("div", { className: "traffic-head" });
  const body = el("div");
  workspace(el("h3", { textContent: "Proxy traffic" }),
    el("p", { className: "hint", textContent: "Requests other programs send through this server's " +
      "OpenAI-compatible proxy, as they happen, with the worker that served each one." }),
    el("div", { className: "where" },
      el("div", { textContent: `${BASE}/v1 — the endpoint is picked by model` }),
      el("div", { textContent: `${BASE}/e/<endpoint>/v1 — one endpoint` })),
    el("div", { className: "go-row" }, labelFor(el("label", { textContent: "show" }), filter), filter, summary),
    body);
  traffic.redraw = () => drawTraffic(summary, body);
  traffic.redraw();
}

function drawTraffic(summary, body) {
  const list = [...traffic.rows.values()].reverse().filter(r => !traffic.filter || r.endpoint === traffic.filter);
  const flying = list.filter(r => IN_FLIGHT.has(r.state)).length;
  const failed = list.filter(r => r.state === "failed").length;
  const state = traffic.state;
  summary.replaceChildren(
    el("span", {}, el("span", { className: `dot ${state === "live" ? "live" : state.startsWith("error") ? "error" : "connecting"}` }),
      state === "live" ? "live" : state),
    el("span", { textContent: `${list.length} request${list.length === 1 ? "" : "s"}` }),
    ...(flying ? [el("span", { className: "count jobs", textContent: `${flying} in flight` })] : []),
    ...(failed ? [el("span", { className: "count bad", textContent: `${failed} failed` })] : []));
  const withheld = traffic.withheld && el("p", { className: "hint", textContent: "Requests made with " +
    "the server's key are not shown: this server is reachable beyond localhost, and they may be " +
    "other people's. Start it with --share-traffic to show them." });
  if (!list.length) return body.replaceChildren(...kids([withheld, el("p", { className: "sub", textContent:
    "None yet. Point an OpenAI client at one of the URLs above." })]));
  const now = Date.now() / 1000;
  const th = (t, num) => el("th", { textContent: t, className: num ? "num" : "" });
  const td = (t, cls = "") => el("td", { textContent: t ?? "–", className: cls });
  const worker = r => r.worker_id != null
    ? el("b", { textContent: String(r.worker_id), title: host(r.worker) })
    : r.worker ? servedBy(r.worker, "short") : el("span", { className: "sub", textContent: "–" });
  body.replaceChildren(...kids([withheld, el("div", { className: "tablewrap" }, el("table", { className: "wk traffic-table" },
    el("thead", {}, el("tr", {}, th("time"), th("endpoint"), th("route"), th("state"), th("status", true),
      th("s", true), th("ttft", true), th("tokens", true), th("worker"), th("prompt → reply"))),
    el("tbody", {}, list.map(r => el("tr", {},
      td(new Date(r.at * 1000).toLocaleTimeString()),
      td(r.endpoint),
      td(LABELS[r.route] || r.route),
      el("td", {}, el("span", { className: `st ${r.state}`, textContent: r.state + (r.stream ? " ⇢" : "") })),
      td(r.status, "num"),
      td(IN_FLIGHT.has(r.state) ? `${Math.max(0, now - r.at).toFixed(0)}…` : r.seconds?.toFixed(2), "num"),
      td(r.ttft?.toFixed(2), "num"),
      td(r.tokens, "num"),
      el("td", {}, worker(r)),
      el("td", { className: "text" }, el("div", { className: "ask", textContent: r.prompt || "" }),
        r.error ? el("div", { className: "err", textContent: r.error })
                : el("div", { textContent: r.reply || (IN_FLIGHT.has(r.state) ? "…" : "") })))))))]));
}

// Returns the panel and keeps it current until the endpoint changes. If this server's stream
// drops, it reconnects with backoff; the server handles the autoscaler's socket.
function watchWorkers(endpointId) {
  const controller = watching = new AbortController();
  const signal = controller.signal;
  const view = { config: null, groups: new Map(), active: new Map(), endpoint: null, state: "connecting",
                 detail: "", retryAt: 0, last: 0, polled: false, warnings: new Set(), showStopped: false };
  workersNow = view;
  const summary = el("summary");
  const body = el("div", { className: "workers-body" });
  const box = el("details", { className: "workers", open: true }, summary, body);
  const draw = () => drawWorkers(view, summary, body);
  const tick = setInterval(draw, 1000);
  view.redraw = draw;
  draw();
  (async () => {
    for (let attempt = 0; !signal.aborted; attempt++) {
      try {
        await ndjson("api/watch", { endpoint: endpointId }, signal, line => {
          if (line.type === "status" && line.state === "live") attempt = 0;
          applyWatch(view, line);
          draw();
        });
        Object.assign(view, { state: "reconnecting", detail: "the server's stream ended" });
      } catch (e) {
        if (e.name === "AbortError") break;
        Object.assign(view, { state: "error", detail: e.message });
        if (e.token) { draw(); break; }
      }
      const wait = Math.min(30000, 1000 * 2 ** attempt);
      view.retryAt = Date.now() + wait;
      draw();
      await sleep(wait, signal);
    }
    clearInterval(tick);
  })();
  return box;
}

function applyWatch(view, line) {
  if (line.type === "config") view.config = line;
  else if (line.type === "status") {
    Object.assign(view, { state: line.state, detail: line.detail || "",
      retryAt: line.retry_in ? Date.now() + line.retry_in * 1000 : 0 });
  } else if (line.type === "warning") view.warnings.add(line.detail);
  else if (line.type === "hosts") {
    for (const [h, id] of Object.entries(line.hosts || {})) workerHosts.set(h, id);
    document.querySelectorAll(".served").forEach(labelServed);
  }
  else if (line.type === "workers") {
    if (line.topic === "workergroup") {
      view.groups.set(line.id, line.workers);
      view.active.set(line.id, !!line.active_update);
    } else view.endpoint = line.workers;
    view.last = Date.now();
    view.polled = !!line.polled;
  }
}

function age(seconds) {
  if (!(seconds >= 0)) return "–";
  if (seconds < 90) return `${Math.round(seconds)}s`;
  if (seconds < 5400) return `${Math.round(seconds / 60)}m`;
  if (seconds < 172800) return `${(seconds / 3600).toFixed(1)}h`;
  return `${Math.round(seconds / 86400)}d`;
}

function round(x, digits = 1) {
  return typeof x === "number" ? String(Math.round(x * 10 ** digits) / 10 ** digits) : "–";
}

function allWorkers(view) {
  if (view.endpoint) return view.endpoint;
  const seen = new Map();
  for (const list of view.groups.values()) for (const w of list) seen.set(w.id, w);
  return [...seen.values()];
}

function drawWorkers(view, summary, body) {
  const workers = allWorkers(view);
  const by = cls => workers.filter(w => statusClass(w) === cls).length;
  const jobs = workers.reduce((n, w) => n + (w.reqs_working || 0), 0);
  const since = view.last ? Math.round((Date.now() - view.last) / 1000) : null;
  const stateText = view.state === "live" ? "live"
    : view.state === "connecting" ? "connecting…"
    : view.retryAt > Date.now() ? `${view.state}, retry in ${Math.ceil((view.retryAt - Date.now()) / 1000)}s`
    : view.state;
  summary.replaceChildren(...kids([
    el("b", { textContent: "Workers" }),
    el("span", {}, el("span", { className: `dot ${view.state}` }), stateText),
    since !== null && el("span", { textContent: `updated ${since}s ago${view.polled ? " (polled)" : ""}` }),
    el("span", { className: "break" }),
    el("span", { className: "count ready", textContent: `${by("ready") + by("busy")} ready` }),
    el("span", { className: "count loading", textContent: `${by("loading")} loading` }),
    by("bad") > 0 && el("span", { className: "count bad", textContent: `${by("bad")} error` }),
    by("off") > 0 && el("span", { textContent: `${by("off")} stopped` }),
    el("span", { className: "count jobs", textContent: `${jobs} in flight` }),
  ]));

  const c = view.config;
  const e = c?.endpoint;
  const parts = [];
  if (view.state !== "live" && view.detail) parts.push(el("p", { className: "warn", textContent: view.detail }));
  for (const w of view.warnings) parts.push(el("p", { className: "warn", textContent: w }));
  if (e) parts.push(settings([["cold_workers", e.cold_workers], ["max_workers", e.max_workers],
    ["min_load", e.min_load], ["target_util", e.target_util],
    ["target_queue_time", e.target_queue_time != null ? `${e.target_queue_time}s` : null],
    ["max_queue_time", e.max_queue_time != null ? `${e.max_queue_time}s` : null]]));

  const stopped = workers.filter(w => statusClass(w) === "off").length;
  if (stopped) {
    const toggle = el("button", { className: "linkish", type: "button",
      textContent: view.showStopped ? `hide stopped (${stopped})` : `show stopped (${stopped})` });
    toggle.addEventListener("click", () => { view.showStopped = !view.showStopped; view.redraw(); });
    parts.push(el("p", { className: "hint" }, toggle));
  }

  const groups = c?.workergroups || [];
  if (groups.length) {
    const grouped = new Set();
    for (const g of groups) {
      const list = view.groups.get(g.id);
      list?.forEach(w => grouped.add(w.id));
      parts.push(el("div", { className: "wg-head" },
        el("span", { textContent: `workergroup ${g.id}` }),
        settings([["cold_workers", g.cold_workers], ["min_load", g.min_load],
          ["gpu_ram", g.gpu_ram != null ? `${g.gpu_ram} GB` : null]]),
        view.active.get(g.id) && el("span", { className: "flag", textContent: "rolling update in progress" })));
      parts.push(list ? workerTable(list, view.showStopped) : el("div", { className: "sub", textContent: "waiting for the first update…" }));
    }
    const others = (view.endpoint || []).filter(w => !grouped.has(w.id));
    if (others.length && groups.every(g => view.groups.has(g.id))) {
      parts.push(el("div", { className: "wg-head" }, el("span", { textContent: "not in a listed workergroup" })));
      parts.push(workerTable(others, view.showStopped));
    }
  } else if (view.endpoint) {
    parts.push(workerTable(view.endpoint, view.showStopped));
  } else if (view.state === "live") {
    parts.push(el("div", { className: "sub", textContent: "waiting for the first update…" }));
  }
  body.replaceChildren(...parts);
}

function workerTable(list, showStopped) {
  if (!list.length) return el("div", { className: "sub", textContent: "No workers." });
  const now = Date.now() / 1000;
  const shown = list.filter(w => showStopped || statusClass(w) !== "off")
    .sort((a, b) => (CLASS_ORDER[statusClass(a)] - CLASS_ORDER[statusClass(b)]) || a.id - b.id);
  if (!shown.length) return el("div", { className: "sub", textContent: "All stopped." });
  const th = (t, num) => el("th", { textContent: t, className: num ? "num" : "" });
  const td = (t, cls = "") => el("td", { textContent: t, className: cls });
  return el("div", { className: "tablewrap" }, el("table", { className: "wk" },
    el("thead", {}, el("tr", {}, th("worker"), th("status"), th("jobs", true), th("load", true))),
    el("tbody", {}, shown.map(w => {
      const cls = statusClass(w);
      const loadTime = w.loaded_at > 0 && w.started_at > 0 ? w.loaded_at - w.started_at : null;
      const about = [`${(w.num_gpus ?? 1) > 1 ? `${w.num_gpus}× ` : ""}${w.gpu_name ?? "?"}`,
        w.started_at > 0 && `up ${age(now - w.started_at)}`,
        loadTime !== null && `loaded ${age(loadTime)}`,
        `perf ${round(w.measured_perf || w.perf)}`].filter(Boolean).join(" · ");
      const off = cls === "off" ? " off" : "";
      return [
        el("tr", { className: `worker${off}` },
          td(String(w.id)),
          el("td", {}, el("span", { className: `st ${cls}`, textContent: w.status })),
          td(String(w.reqs_working ?? 0), `num jobs${w.reqs_working > 0 ? " on" : ""}`),
          td(round(w.cur_load), "num")),
        el("tr", { className: `about${off}` }, el("td", { colSpan: 4, title: `${w.num_gpus ?? 1}× ${w.gpu_name ?? "?"}` +
            (w.started_at > 0 ? ` · up ${age(now - w.started_at)}` : "") +
            (loadTime !== null ? ` · loaded in ${age(loadTime)}` : "") + ` · perf ${round(w.measured_perf || w.perf)}` }, about,
          w.outdated && el("span", { className: "flag", textContent: "outdated" }),
          w.replaces_worker_id > 0 && el("span", { className: "flag", textContent: `replaces ${w.replaces_worker_id}` }),
          w.ready_ever === false && cls === "ready" && el("span", { className: "flag", textContent: "never ready" }))),
      ];
    }))));
}

// ---------- wiring ----------
$("key-form").addEventListener("submit", async event => {
  event.preventDefault();
  if (needsToken && !accessToken) {  // unlocking: nothing is open yet
    const token = $("token").value.trim();
    if (!token) return showError("Enter this server's access token.");
    accessToken = token;
    $("token").value = "";
    if (serverKey) await connect();  // without a server key, the caller's own key comes next
    return showAccess();
  }
  const key = $("key").value.trim();
  if (!key && !serverKey) return showError("Enter your Vast API key.");
  if (!confirmLeave("Connecting again")) return;
  forgetEndpoint();
  setKey(key);
  await connect();
});

function forgetEndpoint() {
  stopEverything();
  watching?.abort();
  sidebarWorkers(null);
  traffic.controller?.abort();
  traffic.rows.clear();
  traffic.redraw = null;
  selected = found = tab = null;
  keptResults.clear();  // another key: another account's results
  $("eps").replaceChildren();
  $("ep-section").hidden = true;
  $("ep-pill").hidden = true;
  placeholder(BLANK);
}

$("traffic-nav").addEventListener("click", showTraffic);

$("forget-token").addEventListener("click", () => {
  if (!confirmLeave("Forgetting the token")) return;
  forgetEndpoint();
  setKey("");
  accessToken = "";
  storeToken("");
  showError("");
  showAccess();
  $("token").focus();
});

$("forget").addEventListener("click", async () => {
  if (!confirmLeave("Forgetting the key")) return;
  forgetEndpoint();
  setKey("");
  showError("");
  if (serverKey) await connect();  // back to the server's key
});
