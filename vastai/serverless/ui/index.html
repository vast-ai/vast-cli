<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vast Serverless UI</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;  /* native controls (number spinners, media bars) to match */
    --bg: #0e1013; --panel: #161a1f; --panel-2: #1c2128; --line: #2a313a;
    --text: #e8ecf1; --muted: #8b95a3; --accent: #5b8cff; --accent-2: #3d6fe8;
    --field-line: #5d6776;  /* a form field's edge: 3:1 against the panel, as WCAG 1.4.11 asks */
    --ok: #3ecf8e; --err: #ff6b6b; --warn: #f0b860; --code: #0b0d10;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    /* chart series: reference palette, dark steps; validated all-pairs on --panel */
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 16px 24px;
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .pill { font: 12px var(--mono); color: var(--muted); background: var(--panel-2);
          border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .pill.ok { color: var(--ok); }
  main { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; padding: 20px 24px;
         max-width: 1600px; margin: 0 auto; align-items: start; }
  /* The sidebar stays in view: the endpoints, and the workers of the one open, beside the work. */
  .side { position: sticky; top: 16px; max-height: calc(100vh - 32px); display: flex; flex-direction: column;
          gap: 16px; min-width: 0; }
  .side > .card { flex: none; overflow-y: auto; }
  .side > .card.workers-card { flex: 0 1 auto; min-height: 160px; padding: 0 16px 14px; }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 16px; }
    .side { position: static; max-height: none; }
    .side > .card.workers-card { max-height: 320px; }
  }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px;
          min-width: 0; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  input, textarea, select { width: 100%; background: var(--code); color: var(--text);
    border: 1px solid var(--field-line); border-radius: 8px; padding: 9px 10px; font: inherit; }
  input#key, textarea.json { font: 13px/1.5 var(--mono); }
  textarea { min-height: 90px; resize: vertical; }
  textarea.json { min-height: 220px; }
  ::placeholder { color: var(--muted); opacity: 1; }  /* 6.4:1 on --code; the browser's grey is 4.2:1 */
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type=checkbox] { width: auto; margin: 0 6px 0 0; vertical-align: middle; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .row label { margin-top: 12px; }
  .check { display: flex; align-items: center; color: var(--muted); font-size: 13px; margin-top: 12px; }
  .go-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
  button { border-radius: 8px; padding: 9px 14px; font: 600 14px system-ui; cursor: pointer; }
  .go { flex: 1; background: var(--accent-2); color: #fff; border: 0; }
  .go:hover { background: #2f5fd4; }
  .go:disabled { opacity: .55; cursor: not-allowed; }
  .ghost { background: none; color: var(--muted); border: 1px solid var(--line); }
  .ghost.small { padding: 2px 10px; font-size: 12px; border-radius: 999px; }
  .smoke td.x { color: var(--err); }
  .go-row select { width: auto; }
  .hint { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  .err { color: var(--err); font: 13px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere;
         margin-top: 12px; }
  .warn { color: var(--warn); font-size: 13px; margin: 6px 0 0; }
  h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 22px 0 8px; }
  .eps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .eps button { width: 100%; display: flex; justify-content: space-between; gap: 10px; text-align: left;
                background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
                font: 14px var(--mono); padding: 9px 12px; }
  .eps button.on { border-color: var(--accent); }
  .eps .state { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 80px 20px; }

  .ws h3 { font-size: 16px; margin: 0; }
  .ws h4 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 18px 0 8px; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
  details.about { margin-top: 10px; }
  details.about > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .routes { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 0; }
  .routes li { font: 13px var(--mono); background: var(--panel-2); border: 1px solid var(--line);
               border-radius: 6px; padding: 3px 9px; }
  .bench { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .group { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .sub { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  table.env { width: 100%; border-collapse: collapse; margin-top: 8px; font: 12.5px var(--mono); }
  table.env td { padding: 4px 8px 4px 0; border-top: 1px solid var(--line); vertical-align: top;
                 overflow-wrap: anywhere; }
  table.env td:first-child { color: var(--muted); white-space: nowrap; }
  table.env .src { color: var(--muted); font-size: 11px; text-align: right; white-space: nowrap;
                   overflow-wrap: normal; padding-right: 0; }
  table.env .item { display: block; }
  table.env .item + .item { margin-top: 2px; }
  /* name value pairs that wrap as whole pairs, never between a name and its value */
  .settings { display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 10px 0 0; font: 12px var(--mono);
              color: var(--muted); }
  .settings span { white-space: nowrap; }
  .settings b { color: var(--text); font-weight: 400; }
  .wg-head .settings { margin: 2px 0 0; flex-basis: 100%; }

  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 18px 0 0; padding-bottom: 10px;
          border-bottom: 1px solid var(--line); align-items: center; }
  .tabs button { background: none; border: 1px solid transparent; color: var(--muted);
                 font: 13px system-ui; padding: 5px 11px; }
  .tabs button.on { border-color: var(--line); background: var(--panel-2); color: var(--text);
                    box-shadow: inset 0 -2px 0 var(--accent); }
  .tabs button.unserved { font-style: italic; }
  .tabs .check { margin: 0 0 0 auto; }
  .editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 14px; }
  @media (max-width: 1200px) { .editor { grid-template-columns: minmax(0, 1fr); } }
  .code-head { display: flex; justify-content: space-between; align-items: center; margin: 0 0 6px; }
  .code-head span { font: 12px var(--mono); color: var(--muted); }
  .ctabs { display: flex; gap: 4px; }
  .ctabs button { background: none; border: 1px solid transparent; color: var(--muted);
                  font: 12px system-ui; padding: 3px 9px; }
  .ctabs button.on { border-color: var(--line); background: var(--panel-2); color: var(--text); }
  pre { margin: 0; background: var(--code); border: 1px solid var(--line); border-radius: 8px;
        padding: 12px; font: 12.5px/1.55 var(--mono); overflow-x: auto; white-space: pre-wrap;
        overflow-wrap: anywhere; color: #c9d4e3; }
  .transcript { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .msg { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap;
         overflow-wrap: anywhere; font-size: 14px; }
  .msg b { display: block; font: 600 11px var(--mono); color: var(--muted); text-transform: uppercase;
           margin-bottom: 2px; }
  .msg.user { background: var(--panel-2); }
  .convo-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
                margin-top: 14px; font: 12px var(--mono); color: var(--muted); }
  .convo-head button { padding: 3px 9px; font-size: 12px; }
  .result > .msg { margin-bottom: 10px; font-size: 13px; }
  .batch .item { margin-bottom: 8px; } .batch audio { width: 100%; }
  .formswitch { align-items: center; margin-bottom: 10px; }
  .comfy-fields { display: grid; gap: 4px; margin-top: 6px; }
  details.howto { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 13px; }
  details.howto > summary { cursor: pointer; font-weight: 600; }
  details.howto p { margin: 6px 0; } details.howto pre { margin: 2px 0 8px; font-size: 12px; }
  details.howto code { font: 12px var(--mono); }
  .comfy-fields .num-field, .comfy-fields .seed-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .comfy-fields .num-field label, .comfy-fields .seed-row > label:first-child { flex-basis: 100%; }
  .comfy-fields .num-field input, .comfy-fields .seed-row input[type=number] { width: 140px; }
  .comfy-outs { display: flex; flex-wrap: wrap; gap: 12px; }
  .comfy-out img, .comfy-out video { max-width: 100%; max-height: 420px; border-radius: 8px; display: block; }
  .comfy-out audio { width: 320px; }
  .help-link { display: block; margin-bottom: 8px; }
  dialog.help { max-width: 560px; border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px;
                background: var(--panel); color: var(--text); font-size: 14px; line-height: 1.55; }
  dialog.help::backdrop { background: rgba(0, 0, 0, 0.55); }
  dialog.help h3 { margin: 0 0 8px; font-size: 16px; }
  dialog.help p { margin: 0 0 10px; color: var(--text); }
  .formswitch .sub { font-size: 12px; margin: 0 4px; }
  .attach { margin-top: 8px; }
  .drop { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-height: 42px;
          border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer;
          color: var(--muted); font-size: 13px; background: var(--panel); position: relative; }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--text); }
  .drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .drop.over { background: var(--panel-2); }
  .drop-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .drop-note { color: var(--warn); font-size: 12px; }
  .drop-note:empty { display: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex-basis: 100%; }
  .chips:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 10px; border-radius: 999px;
          background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font: 12px var(--mono); }
  .chip button { background: none; border: 0; color: var(--muted); padding: 0; font-size: 14px; cursor: pointer;
                 min-width: 24px; min-height: 24px; }
  .chip button:hover { color: var(--text); }
  .msg .thumb { display: block; max-width: 160px; max-height: 120px; margin-top: 6px; border-radius: 6px; }
  .served-line { font: 12.5px var(--mono); color: var(--muted); margin: -4px 0 10px; }
  .served b { color: var(--text); font-weight: 600; }
  .think { margin-bottom: 8px; }
  .think summary { cursor: pointer; font: 12px var(--mono); color: var(--muted); }
  .think-text { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); font-size: 13px;
                max-height: 240px; overflow-y: auto; margin-top: 6px; padding-left: 10px;
                border-left: 2px solid var(--line); }

  .results { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
  .result { border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
  .result.bad { border-color: #5a2a2e; }
  .result { position: relative; }
  .result > .close { position: absolute; top: 4px; right: 4px; background: none; border: 0; padding: 0;
                     min-width: 28px; min-height: 28px; color: var(--muted); font-size: 16px; line-height: 1;
                     cursor: pointer; }
  .result > .close:hover { color: var(--text); }
  .result > .meta { padding-right: 24px; }
  .results-bar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 20px; }
  .results-bar + .results { margin-top: 8px; }

  details.keybox > summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  details.keybox[open] > summary { margin-bottom: 8px; }
  #ep-section { margin-top: 16px; }
  /* Send and its neighbours stay on screen however long the form is. */
  .go-row.send-row { position: sticky; bottom: 0; z-index: 1; background: var(--panel);
                     padding: 10px 0; margin-top: 4px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font: 12px var(--mono);
          color: var(--muted); margin-bottom: 10px; }
  .meta .t { color: var(--ok); font-weight: 600; font-size: 13px; }
  .meta .x { color: var(--err); font-weight: 600; font-size: 13px; }
  .out { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
  .out img, .out video { max-width: 100%; border-radius: 8px; display: block; background: var(--panel-2); }
  .out audio { width: 100%; }
  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .choice + .choice { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
  details.raw { margin-top: 10px; }
  details.raw > summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details.raw pre { margin-top: 6px; max-height: 420px; overflow: auto; }
  .burst-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px;
                margin-top: 10px; }
  .cell { border: 1px solid var(--line); border-radius: 8px; padding: 6px; font: 12px var(--mono);
          color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
  .cell img { width: 100%; border-radius: 6px; display: block; margin-top: 4px; }
  .cell.bad { color: var(--err); border-color: #5a2a2e; }

  /* The card scrolls; the summary, with the counts, stays at its top. */
  details.workers > summary { position: sticky; top: 0; background: var(--panel); padding: 14px 0 8px; }
  details.traffic { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  details.workers > summary .break { flex-basis: 100%; height: 0; }
  details.workers > summary, details.traffic > summary { cursor: pointer; display: flex; flex-wrap: wrap;
                              gap: 6px 12px; align-items: center; font: 12.5px var(--mono); color: var(--muted); }
  details.workers > summary b, details.traffic > summary b { font: 600 14px system-ui; color: var(--text); }
  .where { font: 12px/1.6 var(--mono); color: var(--muted); margin: 8px 0 4px; overflow-wrap: anywhere; }
  .traffic-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font: 12.5px var(--mono);
                  color: var(--muted); }
  .eps .state.busy { color: var(--accent); }
  table.wk td.text { white-space: normal; min-width: 260px; max-width: 520px; font: 12.5px/1.45 system-ui; }
  td.text .ask { color: var(--muted); }
  td.text .err { margin: 0; }
  .st.routing, .st.streaming { color: var(--accent); border-color: #2c3f73; }
  .st.done { color: var(--ok); border-color: #1f4d3a; }
  .st.failed { color: var(--err); border-color: #5a2a2e; } .st.cancelled { color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px;
         background: var(--muted); vertical-align: 1px; }
  .dot.live { background: var(--ok); } .dot.reconnecting, .dot.connecting { background: var(--warn); }
  .dot.error { background: var(--err); }
  .count.ready { color: var(--ok); } .count.loading { color: var(--warn); }
  .count.bad { color: var(--err); } .count.jobs { color: var(--accent); font-weight: 600; }

  .wg-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin: 14px 0 6px;
             font-size: 13px; }
  .wg-head .sub { font-size: 12px; }
  .tablewrap { overflow-x: auto; }
  table.wk { width: 100%; border-collapse: collapse; font: 12.5px var(--mono); }
  table.wk th { text-align: left; color: var(--muted); font-weight: 400; padding: 4px 10px 4px 0;
                border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.wk td { padding: 4px 10px 4px 0; border-bottom: 1px solid var(--panel-2); white-space: nowrap; }
  table.wk td.num, table.wk th.num { text-align: right; }
  /* a worker is two rows: id, status and counts, then what it runs on across the full width */
  table.wk tr.worker td { border-bottom: 0; padding-top: 6px; }
  /* one line, in the narrower proportional face; cut with … (full text on hover) if still too long */
  table.wk tr.about td { padding: 0 0 6px; font: 12px/1.45 system-ui, sans-serif; color: var(--muted);
                         max-width: 0; overflow: hidden; text-overflow: ellipsis; }
  table.wk tr.about .flag { margin: 0 0 0 6px; }
  table.wk tr.off td { color: var(--muted); }
  .st { border-radius: 999px; padding: 1px 8px; font-size: 11.5px; border: 1px solid var(--line); }
  .st.ready { color: var(--ok); border-color: #1f4d3a; } .st.busy { color: var(--accent); border-color: #2c3f73; }
  .st.loading { color: var(--warn); border-color: #5a4720; } .st.bad { color: var(--err); border-color: #5a2a2e; }
  .st.off, .st.other { color: var(--muted); }
  td.jobs.on { color: var(--accent); font-weight: 600; }
  .flag { color: var(--warn); font-size: 11px; margin-right: 6px; }
  .linkish { background: none; border: 0; color: var(--accent); padding: 0; font: 12px system-ui; cursor: pointer; }

  .loadbox { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 14px; }
  .loadbox h4 { margin: 0 0 6px; }
  table.profile { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  table.profile th { text-align: left; color: var(--muted); font-weight: 400; padding: 0 6px 4px 0; }
  table.profile td { padding: 2px 6px 2px 0; }
  table.profile input { padding: 5px 7px; font: 13px var(--mono); }
  table.profile td:last-child { width: 1%; }
  .x-btn { background: none; border: 0; color: var(--muted); padding: 0; min-width: 28px; min-height: 28px;
           font-size: 16px; }
  .estimate { font: 12.5px var(--mono); color: var(--text); margin: 10px 0 0; }
  .charts { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; position: relative; }
  .chart-head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 12px;
                color: var(--muted); }
  .chart-head b { color: var(--text); font-weight: 600; }
  .key { display: inline-flex; align-items: center; gap: 5px; }
  .key i { display: inline-block; width: 14px; height: 2px; border-radius: 1px; }
  .key span { font-family: var(--mono); color: var(--text); }
  svg.chart { display: block; width: 100%; height: 110px; overflow: visible; }
  svg.chart text { fill: var(--muted); font: 10.5px var(--mono); }
  svg.chart .grid { stroke: var(--line); stroke-width: 1; }
  svg.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  svg.chart .end { stroke: var(--panel); stroke-width: 2; }
  svg.chart .cross { stroke: var(--muted); stroke-width: 1; }
  .tip { position: absolute; pointer-events: none; background: var(--panel-2); border: 1px solid var(--line);
         border-radius: 8px; padding: 8px 10px; font: 12px var(--mono); color: var(--text); white-space: nowrap;
         z-index: 2; }
  .tip .k { color: var(--muted); }
  .tip i { display: inline-block; width: 10px; height: 2px; margin-right: 6px; vertical-align: 3px; }
  table.data { border-collapse: collapse; font: 12px var(--mono); margin-top: 6px; }
  table.data th, table.data td { padding: 2px 12px 2px 0; text-align: right; white-space: nowrap; }
  table.data th { color: var(--muted); font-weight: 400; }
  table.data.labelled th:first-child, table.data.labelled td:first-child { text-align: left; }
  table.view { border-collapse: collapse; font: 12.5px var(--mono); margin-top: 6px; width: 100%; }
  table.view th { color: var(--muted); font-weight: 400; border-bottom: 1px solid var(--line); }
  table.view th, table.view td { padding: 3px 0 3px 18px; vertical-align: top; }
  table.view th:first-child, table.view td:first-child { padding-left: 0; }
  table.view .l, table.view .m { text-align: left; } table.view .r { text-align: right; white-space: nowrap; }
  table.view td.m { color: var(--muted); white-space: nowrap; }
  [hidden] { display: none !important; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
                     white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>Vast Serverless UI</h1>
  <span class="pill" id="key-pill">no key</span>
  <span class="pill" id="ep-pill" hidden></span>
</header>
<main>
  <aside class="side">
  <section class="card">
    <details class="keybox" id="key-box" open>
    <summary id="key-summary">API key</summary>
    <!-- No action and no input name: even if script fails, a submit cannot put the key in a URL.
         The page's CSP (form-action 'none') blocks native submission as well. -->
    <form id="key-form" autocomplete="off">
      <div id="token-field" hidden>
        <label for="token">Access token</label>
        <input id="token" type="password" autocomplete="off" spellcheck="false"
               data-1p-ignore data-lpignore="true" placeholder="this server's access token">
      </div>
      <div id="key-field">
        <label for="key" class="visually-hidden">Vast API key</label>
        <input id="key" type="password" autocomplete="off" spellcheck="false"
               data-1p-ignore data-lpignore="true" placeholder="paste your key">
      </div>
      <div class="go-row">
        <button class="go" id="connect" type="submit">Connect</button>
        <button class="ghost" id="forget" type="button" hidden>Forget key</button>
        <button class="ghost" id="forget-token" type="button" hidden>Forget token</button>
      </div>
      <p class="hint" id="key-hint">Held in this tab's memory only and sent with each request. It is never saved
        in the browser or on the server, so reloading the page clears it.</p>
    </form>
    </details>
    <div class="err" id="error" role="alert" hidden></div>
    <div id="ep-section" hidden>
      <ul class="eps"><li><button type="button" id="traffic-nav"><span>Proxy traffic</span>
        <span class="state" id="traffic-count"></span></button></li></ul>
      <h2>Endpoints</h2>
      <ul class="eps" id="eps"></ul>
    </div>
  </section>
  <section class="card workers-card" id="workers-card" aria-label="Workers" hidden></section>
  </aside>
  <section class="card ws" id="workspace"><div class="empty">Connect with your API key, then pick an endpoint.</div></section>
</main>
<script>
"use strict";
// The key lives in this variable (and in the key field until Connect clears it): never in
// storage, cookies or the URL.
let apiKey = "";
let serverKey = false;    // the server was started with a key (VAST_API_KEY or --api-key)
let needsToken = false;   // ... and an access token, which every request must carry
let accessToken = "";     // once accepted, also kept in localStorage (the key never is)
const TOKEN_STORE = "vast-serverless-ui-token";
let selected = null;      // the endpoint picked in the list
let found = null;         // its discovery result
let tab = null;           // the open route tab: {route, form, editor, ...}
const running = new Set(); // AbortControllers of requests in flight, from any tab
let watching = null;      // AbortController of the workers stream
let workersNow = null;    // the live workers view, sampled by load charts
const workerHosts = new Map();  // "ip:port" -> worker id, from the workers stream
let loadRun = null;       // AbortController of the running load
// Requests through this server's proxy: one stream while connected, shown by its own view.
const traffic = { rows: new Map(), state: "off", controller: null, redraw: null, filter: "", withheld: false };
const $ = id => document.getElementById(id);
// Where this page is served from. Requests go relative to it, so the page also works behind a
// reverse proxy that serves it under a path (https://host/tools/ui/ as well as http://host:8765/),
// opened with or without the trailing slash.
const ROOT = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
const BASE = location.origin + ROOT.replace(/\/$/, "");
const BLANK = "Connect with your API key, then pick an endpoint.";
const MAX_RESULTS = 30;
const keptResults = new Map();  // endpoint id -> its results, while the page is open

// workers/openai/routes.py, in that order
const ROUTES = ["/v1/completions", "/v1/chat/completions", "/v1/chat/completions/batch",
  "/v1/embeddings", "/v1/rerank", "/v1/score", "/v1/audio/speech", "/v1/audio/speech/batch",
  "/v1/audio/generate", "/v1/audio/transcriptions", "/v1/audio/translations",
  "/v1/images/generations", "/v1/images/edits", "/v1/videos/sync"];
const LABELS = {
  "/v1/completions": "Completions", "/v1/chat/completions": "Chat",
  "/v1/chat/completions/batch": "Chat batch", "/v1/embeddings": "Embeddings",
  "/v1/rerank": "Rerank", "/v1/score": "Score", "/v1/audio/speech": "Speech",
  "/v1/audio/speech/batch": "Speech batch", "/v1/audio/generate": "Audio generate",
  "/v1/audio/transcriptions": "Transcribe", "/v1/audio/translations": "Translate",
  "/v1/images/generations": "Images", "/v1/images/edits": "Image edits", "/v1/videos/sync": "Video",
  "/generate/sync": "Workflow",
};
const STREAMABLE = new Set(["/v1/completions", "/v1/chat/completions"]);
const UPLOADS = new Set(["/v1/audio/transcriptions", "/v1/audio/translations",
  "/v1/images/edits", "/v1/videos/sync"]);
const MIME = { jpeg: "image/jpeg", jpg: "image/jpeg", png: "image/png", webp: "image/webp" };

// Sample bodies from pyworker's workers/openai/client.py.
const SPEECH_TEXT = "A quick update on the project: the first round of testing went well.";
const BATCH_TEXTS = ["Name a primary colour.", "Name a planet.", "Name an ocean."];
const SPOKEN_LINES = ["Good morning, and welcome aboard.", "Your order has shipped and will arrive on Friday.",
  "Thanks for calling. Goodbye!"];
// A question, its answer and something unrelated: the similarity column shows the difference.
const EMBED_TEXTS = ["How do I reset my password?", "Use the Forgot login link on the sign-in page and follow the email.",
  "Our office is closed on public holidays."];
const RERANK_QUERY = "How do I reset my password?";
const RERANK_DOCS = ["To recover your account, use the 'Forgot login' link and follow the email.",
  "Our office is closed on public holidays.", "Passwords must be at least 12 characters long.",
  "The best pizza in Naples is a matter of fierce debate."];
const UPLOAD_NOTE = "<base64 file: upload support is coming>";
const SAMPLES = {
  "/v1/embeddings": { input: [SPEECH_TEXT] },
  "/v1/rerank": { query: RERANK_QUERY, documents: RERANK_DOCS },
  "/v1/score": { queries: RERANK_QUERY, items: RERANK_DOCS },
  "/v1/audio/speech": { input: SPEECH_TEXT, response_format: "wav" },
  "/v1/audio/speech/batch": { items: BATCH_TEXTS.map(t => ({ input: t })), response_format: "wav" },
  "/v1/audio/generate": { input: "Rain on a tin roof with distant thunder", audio_length: 10 },
  "/v1/audio/transcriptions": { file: UPLOAD_NOTE, filename: "speech.wav" },
  "/v1/audio/translations": { file: UPLOAD_NOTE, filename: "speech.wav" },
  "/v1/images/edits": { image: UPLOAD_NOTE, filename: "input.png", prompt: "Make it a snowy winter scene" },
  "/v1/videos/sync": { prompt: "A red kite flying over a beach, slow camera pan",
                       width: 832, height: 480, num_frames: 33 },
};

// ---------- small DOM helpers: text only, nothing from a server is parsed as HTML ----------
// Children may be nested arrays; null, undefined and false are skipped.
function kids(children) {
  return children.flat(Infinity).filter(c => c !== null && c !== undefined && c !== false);
}
function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...kids(children));
  return node;
}
function pill(text) { return el("span", { className: "pill", textContent: text }); }
function settings(pairs) {  // [[name, value], ...] as pairs that wrap whole
  return el("div", { className: "settings" },
    pairs.map(([name, value]) => el("span", {}, `${name} `, el("b", { textContent: String(value ?? "–") }))));
}
// Marks the chosen one of a set of buttons, for the eye (.on) and for screen readers.
function choose(buttons, chosen, attr = "aria-pressed") {
  buttons.forEach(b => { b.classList.toggle("on", b === chosen); b.setAttribute(attr, String(b === chosen)); });
}
function workspace(...children) { $("workspace").replaceChildren(...kids(children)); }
function sidebarWorkers(box) { $("workers-card").replaceChildren(...kids([box])); $("workers-card").hidden = !box; }
function placeholder(text) { workspace(el("div", { className: "empty", textContent: text })); }
// Every control is named by its label, so a screen reader says what each field is.
let fieldSeq = 0;
function labelFor(label, input) { input.id ||= `field-${++fieldSeq}`; label.htmlFor = input.id; return label; }
function field(labelText, input) { return [labelFor(el("label", { textContent: labelText }), input), input]; }
// pyworker counts max_tokens as a request's workload, and this server sends it as the routing cost.
function costHint(perConversation) {
  return el("p", { className: "hint", textContent: "max_tokens is also the request's cost: the autoscaler and " +
    `worker count it as that many tokens of work${perConversation ? ", once per conversation" : ""}, ` +
    "used or not. Thinking models need room to reason before they answer." });
}
function num(value, props = {}) { return el("input", { type: "number", value, ...props }); }
function select(options, value) {
  return el("select", {}, options.map(([v, t]) => el("option", { value: v, textContent: t, selected: v === value })));
}

// ---------- attached files: placeholders in the JSON editor, put in when sending ----------
// A file becomes "@file:N name (size)" in the body, so the editor stays readable; sending
// replaces each placeholder with the file as a data: URI, which pyworker and vLLM both take.
const attached = new Map();  // "@file:N" -> { name, type, size, url }
let fileSeq = 0;

function size(bytes) {
  return bytes < 1024 ? `${bytes} B` : bytes < 1048576 ? `${Math.round(bytes / 1024)} KB`
    : `${(bytes / 1048576).toFixed(1)} MB`;
}

function attach(name, type, bytes, url) {
  const id = `@file:${++fileSeq}`;
  attached.set(id, { name, type: type || "application/octet-stream", size: bytes, url });
  return `${id} ${name} (${size(bytes)})`;
}

function readFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(attach(file.name, file.type, file.size, reader.result));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function fileOf(value) {
  const id = typeof value === "string" && value.match(/^@file:\d+/)?.[0];
  return id ? attached.get(id) || { missing: id } : null;
}

// The body as sent: a copy with every placeholder replaced by its file.
function withFiles(value) {
  if (Array.isArray(value)) return value.map(withFiles);
  if (value && typeof value === "object") {
    return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, withFiles(v)]));
  }
  const file = fileOf(value);
  if (file?.missing) throw new Error(`${file.missing} is no longer attached; choose the file again.`);
  return file ? file.url : value;
}

// [path, file] for every placeholder in a body, for the code views.
function filesIn(value, path = []) {
  if (Array.isArray(value)) return value.flatMap((v, i) => filesIn(v, [...path, i]));
  if (value && typeof value === "object") return Object.entries(value).flatMap(([k, v]) => filesIn(v, [...path, k]));
  const file = fileOf(value);
  return file && !file.missing ? [[path, file]] : [];
}

// A file chooser whose files become placeholders; onChange runs once they are read.
// A file chooser that also takes dropped files. Each file becomes a placeholder; chosen files
// show as chips with a ×. A picker for several files adds to its list; one for a single file
// replaces it. onChange runs once the files are read.
function filePicker(accept, multiple = false, label = multiple ? "Choose files or drop them here" : "Choose a file or drop it here") {
  const input = el("input", { type: "file", accept, multiple, className: "drop-input" });
  const chips = el("div", { className: "chips" });
  const note = el("span", { className: "drop-note" });
  const zone = el("label", { className: "drop" }, input,
    el("span", { className: "drop-text", textContent: label }), note, chips);
  const picked = { input, el: zone, tokens: [], names: [], onChange: null,
    clear() { input.value = ""; picked.tokens = []; picked.names = []; draw(); } };
  const draw = () => chips.replaceChildren(...picked.tokens.map((token, i) => {
    const file = fileOf(token);
    const remove = el("button", { type: "button", textContent: "×", title: `Remove ${file.name}` });
    remove.setAttribute("aria-label", `Remove ${file.name}`);
    remove.addEventListener("click", e => {
      e.preventDefault();  // inside the label: don't open the file chooser
      picked.tokens.splice(i, 1); picked.names.splice(i, 1);
      draw(); picked.onChange?.();
    });
    return el("span", { className: "chip" }, `${file.name} · ${size(file.size)}`, remove);
  }));
  const add = async files => {
    const ok = files.filter(f => accepts(accept, f));
    note.textContent = ok.length < files.length
      ? `Not added: ${files.filter(f => !ok.includes(f)).map(f => f.name).join(", ")} (wrong type)` : "";
    if (!ok.length) return;
    const tokens = await Promise.all((multiple ? ok : ok.slice(0, 1)).map(readFile));
    const names = (multiple ? ok : ok.slice(0, 1)).map(f => f.name);
    picked.tokens = multiple ? [...picked.tokens, ...tokens] : tokens;
    picked.names = multiple ? [...picked.names, ...names] : names;
    draw(); picked.onChange?.();
  };
  input.addEventListener("change", () => { add([...input.files]); input.value = ""; });
  zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", e => {
    e.preventDefault();
    zone.classList.remove("over");
    add([...e.dataTransfer.files]);
  });
  return picked;
}

// The input's accept list, applied to a dropped file: "image/*", "audio/wav", ".flac" and so on.
function accepts(accept, file) {
  if (!accept) return true;
  const name = file.name.toLowerCase(), type = (file.type || "").toLowerCase();
  return accept.split(",").map(a => a.trim().toLowerCase()).some(a =>
    a.startsWith(".") ? name.endsWith(a) : a.endsWith("/*") ? type.startsWith(a.slice(0, -1)) : type === a);
}

// One file, or a list when there are several: the shape pyworker takes for repeatable fields.
const oneOrMany = list => (list.length === 1 ? list[0] : list);

// A chat message's content as text, naming what is attached.
function contentText(content) {
  if (typeof content === "string") return content;
  if (!Array.isArray(content)) return JSON.stringify(content ?? "");
  return content.map(p => p?.type === "text" ? p.text
    : `[${(p?.type || "?").replace(/_url$/, "")}: ${fileOf(p?.[p.type]?.url)?.name || "url"}]`).join(" ");
}

// ---------- server calls ----------
function headers() {  // without a pasted key, the server uses its own
  return { ...(apiKey ? { "Authorization": `Bearer ${apiKey}` } : {}),
           ...(accessToken ? { "X-Serverless-UI-Token": accessToken } : {}), "Content-Type": "application/json" };
}

// This server's own handlers never answer 404, so a 404 means it lacks the route:
// it was started before an update. The page is re-read on every load; the server is not.
function failure(resp, data, path) {
  if (resp.status === 404) {
    return new Error(`This server has no ${path.split("?")[0]}; it is older than this page. ` +
                     "Restart it (Ctrl-C, then vastai run serverless-ui) to pick up the update.");
  }
  if (data.token) {  // the access token is missing, wrong or changed: ask again, and stop retrying
    accessToken = "";
    storeToken("");
    showAccess();
    return Object.assign(new Error(data.error), { token: true });
  }
  return new Error(data.error || `HTTP ${resp.status}`);
}

// This server always answers in JSON. Anything else, or no answer, came from something in
// front of it: a proxy, or a sign-in that has expired.
const FRONT = "That came from something in front of this server, not from it: a proxy, or a " +
  "sign-in that has expired. Reload the page.";
function notJson(resp) { return { error: `HTTP ${resp.status}. ${FRONT}` }; }

// Same-origin credentials, fetch's default, written out on purpose: a sign-in proxy in front of
// this server knows its users by a cookie, which must come along. This server ignores cookies;
// the key travels in a header.
async function post(path, body, signal) {
  try {
    return await fetch(ROOT + path, { method: "POST", cache: "no-store", credentials: "same-origin",
                                      headers: headers(), body: JSON.stringify(body), signal });
  } catch (e) {
    if (e.name === "AbortError") throw e;
    throw new Error(`Could not reach this server (${e.message}). ${FRONT}`);
  }
}

async function api(path, body = {}, signal) {
  const resp = await post(path, body, signal);
  const data = await resp.json().catch(() => notJson(resp));
  if (!resp.ok) throw failure(resp, data, path);
  return data;
}

// POSTs and calls onLine for each NDJSON line. A JSON (non-stream) reply comes back as-is.
async function ndjson(path, body, signal, onLine) {
  const resp = await post(path, body, signal);
  if (!(resp.headers.get("Content-Type") || "").includes("ndjson")) {
    const data = await resp.json().catch(() => notJson(resp));
    if (!resp.ok) throw failure(resp, data, path);
    return data;
  }
  const reader = resp.body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
    let i;
    while ((i = buffer.indexOf("\n")) >= 0) {
      const line = buffer.slice(0, i).trim();
      buffer = buffer.slice(i + 1);
      if (line) onLine(JSON.parse(line));
    }
    if (done) return null;
  }
}

// ---------- key and endpoint list ----------
function showError(message) {
  $("error").textContent = message || "";
  $("error").hidden = !message;
}

// Leaving a view stops what is running in it, which may be a load run of many minutes: ask
// first. (Finished results stay with their endpoint.)
function busyWith() {
  return [loadRun && "a load run",
    running.size && `${running.size} request${running.size > 1 ? "s" : ""}`].filter(Boolean);
}
function confirmLeave(action) {
  const busy = busyWith();
  return !busy.length || confirm(`Still running: ${busy.join(" and ")}. ${action} stops ${
    busy.length > 1 || running.size > 1 ? "them" : "it"}. Continue?`);
}
// Closing or reloading the tab would stop them too, and lose every result.
window.addEventListener("beforeunload", event => { if (busyWith().length) event.preventDefault(); });

function stopEverything() {
  running.forEach(c => c.abort());
  loadRun?.abort();
}

// The access token is remembered, so a shared server opens without asking each time. It is
// not a Vast key: it only lets this browser use this server, and Forget token removes it.
function storedToken() {
  try { return localStorage.getItem(TOKEN_STORE) || ""; } catch { return ""; }
}
function storeToken(token) {
  try { token ? localStorage.setItem(TOKEN_STORE, token) : localStorage.removeItem(TOKEN_STORE); } catch { /* not kept */ }
}

const KEY_HINT = "Held in this tab's memory only and sent with each request. It is never saved " +
  "in the browser or on the server, so reloading the page clears it.";
const SERVER_KEY_HINT = "Using the server's key (VAST_API_KEY or --api-key). Paste a key to " +
  "use a different one for this tab; it is kept in memory only.";
const TOKEN_HINT = "Open the link the server printed when it started, which carries the token, " +
  "or enter the token here (SERVERLESS_UI_TOKEN or --access-token, if it was given one). " +
  "This browser remembers it until you forget it.";

// A shared server shows only the token field until a token is accepted, then the key field,
// for using a different key than the server's.
function showAccess() {
  const locked = needsToken && !accessToken;
  $("token-field").hidden = !locked;
  $("key-field").hidden = locked;
  $("forget-token").hidden = !needsToken || locked;
  $("key-summary").textContent = locked ? "Access token" : "API key";
  $("connect").textContent = locked ? "Unlock" : "Connect";
  $("connect").className = !locked && serverKey ? "ghost" : "go";  // with the server's key, already connected
  $("key-hint").textContent = locked ? TOKEN_HINT : serverKey ? SERVER_KEY_HINT : KEY_HINT;
  if (locked) {
    $("key-box").open = true;
    placeholder("Enter this server's access token, then pick an endpoint.");
  }
}

function setKey(key) {
  apiKey = key;
  $("key").value = "";
  $("key-pill").textContent = key ? `key …${key.slice(-4)}` : serverKey ? "server's key" : "no key";
  $("key-pill").classList.toggle("ok", !!key || serverKey);
  $("forget").hidden = !key;
}

async function connect() {
  showError("");
  $("connect").disabled = true;
  try {
    const { endpoints } = await api("api/endpoints");
    renderEndpoints(endpoints);
    if (needsToken) storeToken(accessToken);  // it worked: remember it
    if (!selected && endpoints.length) {
      placeholder("Pick an endpoint to test, or Proxy traffic to watch requests from your own programs.");
    }
    // Connected: the list and the workers get the room. Focus goes with it, rather than
    // being lost with the folded box.
    const hadFocus = $("key-box").contains(document.activeElement) || document.activeElement === document.body;
    $("key-box").open = false;
    if (hadFocus) ($("eps").querySelector("button") || $("traffic-nav")).focus();
    followTraffic();
  } catch (e) {
    if (apiKey) setKey("");
    showError(e.message);
  } finally {
    $("connect").disabled = false;
  }
}

// A server started with a key connects straight away; a pasted key still wins.
(async () => {
  try {
    const resp = await fetch(ROOT + "api/server", { cache: "no-store", credentials: "same-origin" });
    const info = await resp.json().catch(() => { throw new Error(notJson(resp).error); });
    serverKey = !!info.has_key;
    needsToken = !!info.needs_token;
  } catch (e) {
    return showError(`Could not read this server's settings: ${e.message}`);
  }
  if (needsToken) accessToken = tokenFromLink() || storedToken();
  if (serverKey) {
    $("key").placeholder = "optional: a different key";
    setKey("");
  }
  showAccess();
  if (needsToken && !accessToken) return $("token").focus();
  if (serverKey) await connect();  // without one, the page waits for the caller's own key
})();

// The link the server prints carries the token in its fragment, which browsers never send.
// It is taken once and removed from the address bar, so it isn't bookmarked or shared.
function tokenFromLink() {
  const token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
  if (token) history.replaceState(null, "", location.pathname);
  return token;
}

function renderEndpoints(list) {
  $("eps").replaceChildren(...list.map(ep => {
    const btn = el("button", { type: "button" },
      el("span", { textContent: ep.name }), el("span", { className: "state", textContent: ep.state || "" }));
    btn.dataset.name = ep.name;
    btn.addEventListener("click", () => selectEndpoint(ep, btn));
    return el("li", {}, btn);
  }));
  $("ep-section").hidden = false;
  if (!list.length) {
    placeholder("This account has no serverless endpoints yet. Make one from a template with " +
      "vastai create endpoint --endpoint_name NAME, then vastai create workergroup --endpoint_name NAME " +
      "--template_hash HASH. It appears here once made: reconnect to look again.");
  }
}

async function selectEndpoint(ep, btn) {
  if (!confirmLeave(`Opening ${ep.name}`)) return;
  stopEverything();
  watching?.abort();
  sidebarWorkers(null);
  traffic.redraw = null;
  selected = ep;
  found = tab = null;
  choose(document.querySelectorAll(".eps button"), btn, "aria-current");
  $("ep-pill").textContent = ep.name;
  $("ep-pill").hidden = false;
  placeholder(`Reading ${ep.name}'s workergroups and templates…`);
  try {
    const result = await api("api/endpoint", { id: ep.id });
    if (selected === ep) renderEndpoint(result);
  } catch (e) {
    if (selected === ep) workspace(el("div", { className: "err", textContent: e.message }));
  }
}

// ---------- endpoint view: what it serves, then a tab per route ----------
function renderEndpoint(result) {
  found = result;
  const { endpoint, summary, workergroups } = result;
  const label = [summary.backend, summary.model].filter(Boolean).join(" · ");
  $("ep-pill").textContent = label ? `${endpoint.name} · ${label}` : endpoint.name;
  const comfy = summary.family === "comfyui-json";
  const familyNote = summary.family === "openai" || comfy ? null
    : !summary.family || summary.family === "unknown" ? "Backend not recognised, so no routes are known to be served."
    : `Detected ${summary.family}: not supported yet.`;
  const showAll = el("input", { type: "checkbox", checked: summary.family !== "openai" && !comfy });
  const tabs = el("div", { className: "tabs" });
  const panel = el("div");
  // Each endpoint's results are kept while the page is open, so switching back finds them.
  const results = keptResults.get(endpoint.id) || el("div", { className: "results" });
  keptResults.set(endpoint.id, results);
  const resultCount = el("span", { className: "sub", role: "status" });  // announces each new result
  const clearAll = el("button", { className: "ghost small", type: "button", textContent: "Clear all",
    title: "Remove every result, stopping anything still running" });
  const resultsBar = el("div", { className: "results-bar", hidden: true }, resultCount, clearAll);
  results.onChange = () => {
    const n = results.children.length;
    resultsBar.hidden = !n;
    resultCount.textContent = `${n} result${n === 1 ? "" : "s"}` + (n >= MAX_RESULTS ? ` (the latest ${MAX_RESULTS}; older ones are dropped)` : "");
  };
  clearAll.addEventListener("click", () => {
    if (!confirmLeave("Clearing")) return;
    // Load runs, bursts and smoke tests take minutes to make again: ask before they go.
    const costly = results.querySelectorAll(".charts, .burst-grid, .result.smoke").length;
    if (costly && !confirm(`Clear all ${results.children.length} results, including ${costly} load ` +
                           "run, burst or smoke test result(s)? This can't be undone.")) return;
    stopEverything();
    results.replaceChildren();
    results.onChange();
  });

  const drawTabs = () => {
    const served = new Set(summary.routes);
    const shown = comfy ? [COMFY] : ROUTES.filter(r => showAll.checked || served.has(r));
    tabs.replaceChildren(...shown.map(r => {
      const b = el("button", { type: "button", textContent: LABELS[r],
        className: (tab?.route === r ? "on " : "") + (served.has(r) ? "" : "unserved"),
        title: served.has(r) ? r : `${r}: not in this endpoint's routes (expect 404)` });
      b.setAttribute("aria-pressed", String(tab?.route === r));
      b.addEventListener("click", () => { openTab(r, panel, results); drawTabs(); });
      return b;
    }), ...(comfy ? [] : [el("label", { className: "check" }, showAll, "show all routes")]));
  };
  showAll.addEventListener("change", drawTabs);

  const smoke = el("button", { className: "ghost small", type: "button", textContent: "Smoke test…",
    title: "One small request to each route this endpoint serves" });
  smoke.addEventListener("click", () => placeResult(results, smokeCard(summary)));

  workspace(
    el("h3", { textContent: endpoint.name }),
    el("div", { className: "badges" },
      pill(`state: ${endpoint.state ?? "?"}`), pill(`backend: ${summary.backend ?? "?"}`),
      comfy ? pill(`workflows: ${summary.comfy?.workflows.length ?? 0} provisioned`) : pill(`model: ${summary.model ?? "?"}`),
      smoke),
    familyNote && el("p", { className: "warn", textContent: familyNote }),
    summary.warnings.map(w => el("p", { className: "warn", textContent: w })),
    el("details", { className: "about" },
      el("summary", { textContent: `Served routes and workergroups (${workergroups.length})` }),
      renderAbout(summary, workergroups)),
    tabs, panel, resultsBar, results);
  results.onChange();  // results kept from an earlier visit
  sidebarWorkers(watchWorkers(endpoint.id));

  const first = summary.routes[0] || ROUTES[1];
  openTab(first, panel, results);
  drawTabs();
}

function renderAbout(summary, workergroups) {
  const benchmarks = new Set(workergroups.map(g => g.detected.benchmark_route).filter(Boolean));
  return [
    el("h4", { textContent: `Served routes (${summary.routes.length})` }),
    summary.routes.length
      ? el("ul", { className: "routes" }, summary.routes.map(r => el("li", { textContent: r },
          benchmarks.has(r) && el("span", { className: "bench", textContent: "benchmark" }))))
      : el("div", { className: "sub", textContent: "None known." }),
    el("h4", { textContent: `Workergroups (${workergroups.length})` }),
    workergroups.map(renderGroup),

}

function renderGroup(g) {
  const t = g.template;
  const where = t ? `${t.name ?? "unnamed"} · ${t.image}:${t.tag ?? "latest"} · ${t.hash_id}`
    : g.template_error ? `template lookup failed: ${g.template_error}`
    : g.template_missing ? "template not visible to this key (private to another account?)"
    : "no template";
  const rows = Object.entries(g.detected.env).map(([name, v]) =>
    el("tr", {}, el("td", { textContent: name }),
       el("td", {}, String(v.value).split(";").filter(Boolean).map(item => el("span", { className: "item", textContent: item }))),
       el("td", { className: "src", textContent: v.from })));
  return el("div", { className: "group" },
    el("div", { textContent: `workergroup ${g.id}` }),
    el("div", { className: "sub", textContent: where }),
    g.has_launch_args && el("div", { className: "sub", textContent: "+ env from launch_args" }),
    g.detected.warnings.map(w => el("p", { className: "warn", textContent: w })),
    rows.length ? el("table", { className: "env" }, el("tbody", {}, rows))
                : el("div", { className: "sub", textContent: "No recognised env vars." }));

// ---------- a route tab: an optional form that writes the JSON body, which is what is sent ----------
function openTab(route, panel, results) {
  const model = found.summary.model;
  const withModel = body => (model ? { model, ...body } : body);
  const editor = el("textarea", { className: "json", spellcheck: false });
  editor.setAttribute("aria-label", `Request body for ${route} (JSON)`);
  const code = el("pre", { hidden: true });
  let form = null;
  const formSlot = el("div");
  const choices = formChoices(route);
  const switcher = el("div", { className: "ctabs formswitch" });
  const count = select([1, 4, 8, 16, 32, 64].map(n => [String(n), `×${n}`]), "1");
  count.title = "Concurrent requests (a burst does not stream)";
  count.setAttribute("aria-label", "Requests to send at once");
  const send = el("button", { className: "go", type: "button", textContent: "Send" });
  const stop = el("button", { className: "ghost", type: "button", textContent: "Stop", hidden: true });
  const loadToggle = el("button", { className: "ghost", type: "button", textContent: "Load…",
    title: "Send a stream of requests at a rate that changes over time" });
  const status = el("p", { className: "err", role: "alert", hidden: true });
  const viewJson = el("button", { type: "button", textContent: "JSON", className: "on", ariaPressed: "true" });
  const viewSdk = el("button", { type: "button", textContent: "Python SDK" });
  const viewOpenai = el("button", { type: "button", textContent: route === COMFY ? "HTTP via proxy" : "OpenAI client",
    title: "The same call through this server's proxy" });
  const self = tab = { route, form, editor, results, send, stop, status, count, controller: null, edits: {} };
  // Puts a form in place; the switch calls it again, and the body follows.
  const mount = choice => {
    form = tab.form = choice.make(route, withModel);
    self.edits = {};  // a different form writes a different body
    form.onChange = sync;
    form.inputs.forEach(i => i.addEventListener("input", sync));
    formSlot.replaceChildren(...kids([helpButton(choices.length > 1 && HELP[choice.name] ? choice.name : route), form.el]));
    switcher.replaceChildren(
      el("span", { className: "sub", textContent: "form:" }),
      ...choices.map(c => {
        const b = el("button", { type: "button", textContent: c.name, className: c.name === choice.name ? "on" : "" });
        b.setAttribute("aria-pressed", String(c.name === choice.name));
        b.addEventListener("click", () => { if (c.name !== choice.name) mount(c); });
        return b;
      }),
      ...(choice.match?.test(model || "") ? [el("span", { className: "sub", textContent: `chosen for ${model}` })] : []));
    sync();
  };

  let mode = "json";
  const showCode = () => {
    code.textContent = mode === "openai" ? openaiCode(route, editor.value) : sdkCode(route, editor.value);
  };
  // Fields changed in the editor by hand (top level; undefined = removed) are kept when the
  // form rewrites the body, and named under it, until Reset.
  let formBody = {};
  const edited = el("p", { className: "hint", hidden: true });
  const resetEdits = el("button", { className: "linkish", type: "button", textContent: "reset from the form" });
  resetEdits.addEventListener("click", () => { self.edits = {}; sync(); });
  const showEdits = () => {
    const keys = Object.keys(self.edits);
    edited.hidden = !keys.length;
    edited.replaceChildren(`Your edits to ${keys.join(", ")} are kept when the form changes · `, resetEdits);
  };
  const sync = () => {
    formBody = form.body();
    const body = { ...formBody };
    for (const [k, v] of Object.entries(self.edits)) {
      if (v === undefined) delete body[k]; else body[k] = v;
    }
    editor.value = JSON.stringify(body, null, 2);
    showEdits();
    showCode();
  };
  editor.addEventListener("input", () => {
    let body;
    try { body = JSON.parse(editor.value); } catch { body = null; }
    if (body && typeof body === "object" && !Array.isArray(body)) {
      const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
      self.edits = Object.fromEntries([...new Set([...Object.keys(formBody), ...Object.keys(body)])]
        .filter(k => !same(formBody[k], body[k])).map(k => [k, body[k]]));
      showEdits();
    }
    showCode();
  });
  const view = next => {
    mode = next;
    editor.hidden = mode !== "json"; code.hidden = mode === "json";
    choose([viewJson, viewSdk, viewOpenai], { json: viewJson, sdk: viewSdk, openai: viewOpenai }[mode]);
    showCode();
  };
  viewJson.addEventListener("click", () => view("json"));
  viewSdk.addEventListener("click", () => view("sdk"));
  viewOpenai.addEventListener("click", () => view("openai"));
  send.addEventListener("click", () => run(tab));
  stop.addEventListener("click", () => self.controller?.abort());
  const loadBox = loadPanel(tab);
  loadBox.hidden = true;
  loadToggle.addEventListener("click", () => { loadBox.hidden = !loadBox.hidden; });

  panel.replaceChildren(el("div", { className: "editor" },
    el("div", {}, ...(choices.length > 1 ? [switcher] : []), formSlot,
      el("div", { className: "go-row send-row" }, send, count, stop, loadToggle), status, loadBox),
    el("div", {},
      el("div", { className: "code-head" }, el("span", { textContent: `POST ${route}` }),
        el("div", { className: "ctabs" }, viewJson, viewSdk, viewOpenai)),
      editor, code, edited,
      el("p", { className: "hint", textContent: "The form writes this body; edit it to send anything else." }))));
  mount(firstChoice(route, model));
}

function rawForm(route, withModel) {
  return { el: el("p", { className: "hint", textContent:

}

const FORMS = {
  "/v1/completions": (route, withModel) => {
    const prompt = el("textarea", { value: "The three most useful things to know about GPUs are" });
    const maxTokens = num(128, { min: 1 }), temperature = num(0.7, { step: 0.1, min: 0 });
    const stream = el("input", { type: "checkbox", checked: true });
    return {
      el: el("div", {}, field("prompt", prompt),
        el("div", { className: "row" }, el("div", {}, field("max_tokens", maxTokens)),
          el("div", {}, field("temperature", temperature))),
        costHint(false),
        el("label", { className: "check" }, stream, "stream")),
      inputs: [prompt, maxTokens, temperature, stream],
      body: () => withModel({ prompt: prompt.value, max_tokens: Number(maxTokens.value),
        temperature: Number(temperature.value), stream: stream.checked,
        ...(stream.checked ? { stream_options: { include_usage: true } } : {}) }),
    };
  },

  "/v1/chat/completions": (route, withModel) => {
    const system = el("textarea", { value: "", placeholder: "(optional)" });
    system.style.minHeight = "60px";
    const message = el("textarea", { value: "Explain what a serverless GPU endpoint is in two sentences." });
    const maxTokens = num(2048, { min: 1 }), temperature = num(0.7, { step: 0.1, min: 0 });
    const stream = el("input", { type: "checkbox", checked: true });
    const files = filePicker("image/*,audio/*,video/*", true, "Attach images, audio or video: choose or drop them here");
    const transcript = el("div", { className: "transcript" });
    const convoHead = el("div", { className: "convo-head" });
    const messageLabel = labelFor(el("label"), message);
    const reset = el("button", { className: "ghost", type: "button", textContent: "New conversation" });
    let history = [], conversation = 1;
    const turns = msgs => msgs.filter(m => m.role === "user").length;
    const form = {
      inputs: [system, message, maxTokens, temperature, stream],
      blank: () => !message.value.trim() && !files.tokens.length,
      body: () => withModel({
        messages: [...(system.value.trim() ? [{ role: "system", content: system.value }] : []),
                   ...history, { role: "user", content: userContent() }],
        max_tokens: Number(maxTokens.value), temperature: Number(temperature.value), stream: stream.checked,
        ...(stream.checked ? { stream_options: { include_usage: true } } : {}) }),
      // Heads a result card: which conversation and turn it was, and what was asked.
      ask(sent) {
        const msgs = Array.isArray(sent.messages) ? sent.messages : [];
        const last = msgs.findLast(m => m?.role === "user");
        return { tag: `conversation ${conversation} · turn ${turns(msgs)}`, text: contentText(last?.content) };
      },
      // After a reply: the conversation is what was sent plus the answer.
      done(sent, reply) {
        if (!Array.isArray(sent.messages) || !reply) return;  // no answer: let them retry the same turn
        history = [...sent.messages.filter(m => m.role !== "system"), { role: "assistant", content: reply }];
        message.value = "";
        files.clear();  // sent: they stay in the conversation, and go again with each turn
        draw();
        form.onChange();
      },
    };
    const draw = () => {
      const n = turns(history);
      convoHead.replaceChildren(
        el("span", { textContent: n ? `Conversation ${conversation} · ${n} turn${n > 1 ? "s" : ""} so far`
                                    : `Conversation ${conversation} · new` }),
        ...(n ? [reset] : []));
      transcript.hidden = !n;
      transcript.replaceChildren(...history.map(m =>
        el("div", { className: `msg ${m.role}` }, el("b", { textContent: m.role }), contentText(m.content),
          ...filesIn(m.content).filter(([, f]) => f.type.startsWith("image/"))
            .map(([, f]) => el("img", { className: "thumb", src: f.url, alt: f.name, title: f.name })))));
      messageLabel.textContent = n ? `your reply · turn ${n + 1}, sent with the ${history.length} messages above`
                                   : "message";
      message.placeholder = n ? "Write a follow-up to continue, or start a new conversation." : "";
    };
    // Text, then each attached file as an OpenAI content part (vLLM's names for audio and video).
    const userContent = () => !files.tokens.length ? message.value : [
      { type: "text", text: message.value },
      ...files.tokens.map(token => {
        const kind = fileOf(token).type.split("/")[0];
        const part = kind === "audio" ? "audio_url" : kind === "video" ? "video_url" : "image_url";
        return { type: part, [part]: { url: token } };
      })];
    files.onChange = () => form.onChange();
    reset.addEventListener("click", () => {
      const n = turns(history);
      if (n > 1 && !confirm(`Start a new conversation? The ${n} turns so far stay as results, but ` +
                            "this conversation can't be continued.")) return;
      history = []; conversation += 1; files.clear(); draw(); form.onChange(); message.focus();
    });
    draw();
    form.el = el("div", {}, field("system", system), convoHead, transcript, messageLabel, message,
      el("div", { className: "attach" }, files.el),
      el("div", { className: "row" }, el("div", {}, field("max_tokens", maxTokens)),
        el("div", {}, field("temperature", temperature))),
      costHint(false),
      el("label", { className: "check" }, stream, "stream"));
    return form;
  },

  "/v1/chat/completions/batch": (route, withModel) => {
    const prompts = el("textarea", { value: BATCH_TEXTS.join("\n") });
    const maxTokens = num(64, { min: 1 });
    return {
      el: el("div", {}, field("prompts, one conversation per line", prompts), field("max_tokens", maxTokens),
        costHint(true)),
      inputs: [prompts, maxTokens],
      body: () => withModel({
        messages: prompts.value.split("\n").filter(l => l.trim()).map(l => [{ role: "user", content: l }]),
        max_tokens: Number(maxTokens.value) }),
    };
  },

  "/v1/images/generations": (route, withModel) => {
    const prompt = el("textarea", { value: "A lighthouse on a rocky coast at dusk, oil painting" });
    const size = select(["1024x1024", "1344x768", "768x1344", "1152x896", "896x1152", "1536x640"]
      .map(s => [s, s]), "1024x1024");
    const format = select([["jpeg", "jpeg"], ["png", "png"], ["webp", "webp"]], "jpeg");
    const steps = el("input", { type: "number", min: 1, placeholder: "model default" });
    const n = num(1, { min: 1, max: 8 });
    return {
      el: el("div", {}, field("prompt", prompt),
        el("div", { className: "row" }, el("div", {}, field("size", size)),
          el("div", {}, field("output_format", format)), el("div", {}, field("n", n)),
          el("div", {}, field("num_inference_steps", steps)))),
      inputs: [prompt, size, format, steps, n],
      body: () => withModel({ prompt: prompt.value, size: size.value, output_format: format.value,
        n: Number(n.value), ...(steps.value ? { num_inference_steps: Number(steps.value) } : {}) }),
    };
  },
};

// Some models serve a route with a different request: vLLM-Omni serves YuE (music) on the
// speech route, taking lyrics as input, the style as instructions and a length in frames.
const YUE_FPS = 25;  // max_new_tokens per second of song (vLLM-Omni's YuE2 recipe)
const MUSIC_LYRICS = "[verse]\nLights on the water, the night is young\nWe sing the songs that we always sung\n\n" +
  "[chorus]\nHold on, hold on, the morning is near\nHold on, hold on, I'm still right here";
function musicForm(route, withModel) {
    const lyrics = el("textarea", { value: MUSIC_LYRICS });
    lyrics.style.minHeight = "140px";
    const style = el("input", { type: "text", value: "upbeat indie pop, female vocals, warm synths, 110 BPM" });
    const seconds = num(20, { min: 2, max: 360 });
    const seed = el("input", { type: "number", placeholder: "random" });
    const plan = el("input", { type: "checkbox" });
    return {
      el: el("div", {}, field("lyrics ([verse], [chorus] … sections)", lyrics), field("style", style),
        el("div", { className: "row" }, el("div", {}, field("length (seconds)", seconds)), el("div", {}, field("seed", seed))),
        el("label", { className: "check" }, plan, "plan the song first (slower; sets cot)"),
        el("p", { className: "hint", textContent: `A music model on the speech route: lyrics go in input, the style ` +
          `in instructions, and the length as max_new_tokens (${YUE_FPS} a second). The song arrives when it is finished.` })),
      inputs: [lyrics, style, seconds, seed, plan],
      body: () => withModel({ input: lyrics.value, instructions: style.value,
        max_new_tokens: Math.round(Number(seconds.value) * YUE_FPS), ...(seed.value ? { seed: Number(seed.value) } : {}),
        response_format: "wav", extra_params: { cot: plan.checked ? "on" : "off" } }),
  };
}

// Routes that can take more than one kind of request get a switch between forms. The first
// whose `match` fits the endpoint's model is chosen to begin with, else the first listed; a
// form without `make` is the route's usual one.
const ALT_FORMS = {
  "/v1/audio/speech": [{ name: "speech" }, { name: "music", match: /yue/i, make: musicForm }],
};
function formChoices(route) {
  return (ALT_FORMS[route] || [{ name: "form" }]).map(f => ({ ...f, make: f.make || FORMS[route] || rawForm }));
}
function firstChoice(route, model) {
  const choices = formChoices(route);
  return choices.find(f => f.match?.test(model || "")) || choices[0];
}

  const form = {
